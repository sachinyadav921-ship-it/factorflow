<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#070b12;color:#e2e8f0;font-family:'DM Sans',sans-serif;overscroll-behavior:none;min-height:100vh}
::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.app{max-width:430px;margin:0 auto;padding-bottom:80px;position:relative;z-index:1}
.glow1{position:fixed;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.07),transparent 70%);pointer-events:none;z-index:0}
.glow2{position:fixed;bottom:-60px;left:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.05),transparent 70%);pointer-events:none;z-index:0}
.header{padding:20px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px}
.logo span{color:#fbbf24}
.sublabel{font-size:10px;color:#475569;letter-spacing:0.8px;font-family:'DM Mono',monospace;margin-top:2px}
.fetch-btn{display:flex;align-items:center;gap:6px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:20px;padding:7px 13px;color:#fbbf24;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.fetch-btn:disabled{color:#475569;cursor:not-allowed}
.spin-el{width:10px;height:10px;border:2px solid #fbbf24;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
.live-dot{width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block;animation:pulse 2s infinite}
.demo-dot{width:6px;height:6px;border-radius:50%;background:#475569;display:inline-block}
.tab-content{padding:0 20px;animation:fadeIn 0.3s ease}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(7,11,18,0.97);border-top:1px solid rgba(255,255,255,0.05);backdrop-filter:blur(20px);display:flex;z-index:100}
.nav-btn{flex:1;padding:10px 0 13px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-icon{font-size:16px;opacity:0.3;transition:opacity 0.2s}
.nav-icon.active{opacity:1}
.nav-label{font-size:9px;font-weight:600;color:#475569;letter-spacing:0.3px}
.nav-label.active{color:#fbbf24}
.nav-dot{width:4px;height:4px;border-radius:50%;background:#fbbf24;display:none}
.card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:14px;padding:14px;margin-bottom:12px}
.nifty-card{background:linear-gradient(135deg,rgba(15,23,42,0.95),rgba(20,32,54,0.7));border:1px solid rgba(255,255,255,0.05);border-radius:18px;padding:18px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.small-card{background:rgba(255,255,255,0.02);border-radius:12px;padding:13px}
.mono{font-family:'DM Mono',monospace}
.syne{font-family:'Syne',sans-serif}
.label{font-size:10px;color:#475569;font-weight:600;letter-spacing:0.5px;font-family:'DM Mono',monospace;margin-bottom:3px}
.signal-strip{border-radius:14px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.bar-bg{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:3px;transition:width 0.9s cubic-bezier(0.34,1.56,0.64,1)}
.fund-card{border-radius:14px;padding:13px;margin-bottom:9px;animation:slideIn 0.3s ease}
.notif-btn{width:100%;margin-bottom:12px;padding:11px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.25);border-radius:12px;color:#818cf8;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.live-badge{background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.2);border-radius:12px;padding:8px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:11px;color:#34d399;font-weight:600}
.countdown-bar{height:4px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.countdown-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:2px;transition:width 1s linear}
.apply-btn{width:100%;padding:14px;background:linear-gradient(135deg,rgba(251,191,36,0.2),rgba(251,191,36,0.07));border:1px solid rgba(251,191,36,0.3);border-radius:14px;color:#fbbf24;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;font-family:'DM Sans',sans-serif}
.applied-box{text-align:center;padding:14px;color:#34d399;font-weight:600;font-size:13px;background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.2);border-radius:14px;margin-top:4px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 18px;font-size:12px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.6);display:none;animation:fadeIn 0.3s ease}
.hist-card{border-radius:14px;padding:13px;margin-bottom:10px}
.tag{border-radius:8px;padding:4px 8px;font-size:11px;font-family:'DM Mono',monospace;display:inline-block;margin:2px}
.ai-box{background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.18);border-radius:16px;padding:14px;margin-bottom:14px}
.ai-btn{width:100%;padding:14px;margin-bottom:14px;border:1px solid rgba(99,102,241,0.25);border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.ai-result{background:rgba(15,23,42,0.9);border:1px solid rgba(99,102,241,0.15);border-radius:14px;padding:16px;margin-bottom:14px}
.view-btn{width:100%;padding:14px;background:linear-gradient(135deg,rgba(251,191,36,0.18),rgba(251,191,36,0.06));border:1px solid rgba(251,191,36,0.3);border-radius:14px;color:#fbbf24;font-weight:700;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif}
.num-input{background:transparent;border:none;outline:none;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#fbbf24;width:100%}
.empty-state{text-align:center;padding:60px 20px;color:#334155}
.fetch-msg{margin:0 20px 10px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.15);border-radius:10px;padding:8px 14px;font-size:11px;color:#fbbf24}
</style>
</head>
<body>

<div class="glow2"></div>
<div id="toast"></div>
<div class="app">
  <div class="header">
    <div>
      <div class="logo">FACTOR<span>FLOW</span></div>
      <div class="sublabel">AUTO-ALLOCATION ENGINE</div>
    </div>
    <button class="fetch-btn" id="fetchBtn">
      <span class="demo-dot" id="liveDot"></span>
      <span id="fetchLabel">Get Live Data</span>
    </button>
  </div>
  <div id="fetchMsg" style="display:none" class="fetch-msg">⏳ Fetching live data…</div>
  <div id="tabHome"    class="tab-content"></div>
  <div id="tabAlloc"   class="tab-content" style="display:none"></div>
  <div id="tabSignals" class="tab-content" style="display:none"></div>
  <div id="tabHistory" class="tab-content" style="display:none"></div>
  <div id="tabAi"      class="tab-content" style="display:none"></div>
</div>

// ENGINE
function getZone(pe) { return pe<18?'DEEP_VALUE':pe<22?'FAIR_VALUE':pe<26?'EXPENSIVE':'BUBBLE'; }
function getMom(p,s50,s200) {
  var s=50;
  if(p>s50) s+=20; else s-=20;
  if(p>s200) s+=20; else s-=20;
  if(s50>s200) s+=10; else s-=10;
  return Math.max(0,Math.min(100,s));
}
function getSignal(pe,mom) {
  var z=getZone(pe);
  if(z==='DEEP_VALUE'&&mom>=60) return 'STRONG_BULL';
  if(z==='DEEP_VALUE') return 'BULL';
  if(z==='FAIR_VALUE'&&mom>=60) return 'BULL';
  if(z==='FAIR_VALUE'&&mom<40) return 'NEUTRAL';
  if(z==='FAIR_VALUE') return 'NEUTRAL';
  if(z==='EXPENSIVE'&&mom>=60) return 'NEUTRAL';
  if(z==='EXPENSIVE'&&mom<40) return 'BEAR';
  if(z==='EXPENSIVE') return 'BEAR';
  return 'STRONG_BEAR';
}
function computeAlloc(sig) {
  var p=sig.nifty50||22187, s50=sig.sma50||Math.round(p*0.972), s200=sig.sma200||Math.round(p*0.941);
  var mom=getMom(p,s50,s200), signal=getSignal(sig.niftyPE,mom), zone=getZone(sig.niftyPE);
  var BASE = {
    STRONG_BULL:{momentum:38,quality:20,value:27,lowvol:8,gold:7},
    BULL:{momentum:28,quality:24,value:25,lowvol:10,gold:13},
    NEUTRAL:{momentum:18,quality:28,value:22,lowvol:14,gold:18},
    BEAR:{momentum:8,quality:28,value:16,lowvol:20,gold:28},
    STRONG_BEAR:{momentum:4,quality:22,value:12,lowvol:18,gold:44}
  };
  var a = Object.assign({}, BASE[signal]);
  if (sig.vix > 20) {
    var sh = Math.min(8, Math.round((sig.vix-20)*0.8));
    a.momentum = Math.max(2, a.momentum-sh);
    a.lowvol = Math.min(30, a.lowvol+Math.round(sh*0.6));
    a.gold = Math.min(50, a.gold+Math.round(sh*0.4));
  }
  var sum = Object.values(a).reduce(function(x,y){return x+y;},0);
  if (sum !== 100) a.quality += (100-sum);
  return Object.assign(a, {_signal:signal, _zone:zone, _mom:mom});
}

// FETCH — Yahoo Finance
async function fetchYahoo() {
  var CORS = 'https://api.allorigins.win/raw?url=';
  var N = 'https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1d&range=1d';
  var V = 'https://query1.finance.yahoo.com/v8/finance/chart/%5EINDIAVIX?interval=1d&range=1d';
  var P = 'https://query1.finance.yahoo.com/v10/finance/quoteSummary/%5ENSEI?modules=summaryDetail';
  try {
    var ctrl = new AbortController();
    setTimeout(function(){ctrl.abort();}, 9000);
    var responses = await Promise.all([
      fetch(CORS + encodeURIComponent(N), {signal:ctrl.signal}),
      fetch(CORS + encodeURIComponent(V), {signal:ctrl.signal}),
      fetch(CORS + encodeURIComponent(P), {signal:ctrl.signal})
    ]);
    if (!responses[0].ok) return null;
    var nD = await responses[0].json();
    var vD = responses[1].ok ? await responses[1].json() : null;
    var pD = responses[2].ok ? await responses[2].json() : null;
    var meta = nD && nD.chart && nD.chart.result && nD.chart.result[0] && nD.chart.result[0].meta;
    if (!meta) return null;
    var price = parseFloat(meta.regularMarketPrice || 22187);
    var prev  = parseFloat(meta.chartPreviousClose || price);
    var chg   = ((price - prev) / prev * 100);
    var peRaw = pD && pD.quoteSummary && pD.quoteSummary.result && pD.quoteSummary.result[0] &&
                pD.quoteSummary.result[0].summaryDetail && pD.quoteSummary.result[0].summaryDetail.trailingPE &&
                pD.quoteSummary.result[0].summaryDetail.trailingPE.raw;
    var pe = (peRaw && peRaw > 5 && peRaw < 80) ? parseFloat(peRaw.toFixed(1)) : 21.4;
    var vMeta = vD && vD.chart && vD.chart.result && vD.chart.result[0] && vD.chart.result[0].meta;
    var vix   = parseFloat(((vMeta && vMeta.regularMarketPrice) || 13.8).toFixed(1));
    var w52h  = parseFloat((meta.fiftyTwoWeekHigh || price*1.15));
    var w52l  = parseFloat((meta.fiftyTwoWeekLow  || price*0.85));
    var sma200 = Math.round((w52h + w52l) / 2);
    var sma50  = Math.round(sma200*1.02 + (price - sma200)*0.3);
    return {
      nifty50:   Math.round(price),
      niftyPE:   pe,
      niftyChg:  parseFloat(chg.toFixed(2)),
      niftyOpen: Math.round(parseFloat(meta.regularMarketOpen    || price)),
      niftyHigh: Math.round(parseFloat(meta.regularMarketDayHigh || price)),
      niftyLow:  Math.round(parseFloat(meta.regularMarketDayLow  || price)),
      sma50: sma50, sma200: sma200,
      vix: vix, vixChg: 0,
      fetchedAt: new Date().toLocaleTimeString('en-IN'),
      isLive: true, source: 'yahoo'
    };
  } catch(e) { return null; }
}

// FETCH
async function doFetch() {
  if(ST.fetching) return;
  ST.fetching = true;
  var btn=document.getElementById('fetchBtn');
  var lbl=document.getElementById('fetchLabel');
  var dot=document.getElementById('liveDot');
  var msg=document.getElementById('fetchMsg');
  btn.disabled=true;
  lbl.textContent='Fetching\u2026';
  dot.className='spin-el';
  msg.style.display='block';
  var data = await fetchYahoo();
  var fd = data || Object.assign({},MOCK,{isLive:false,source:'demo'});
  ST.prev = Object.assign({},ST.alloc);
  ST.signals = fd;
  ST.alloc = computeAlloc(fd);
  ST.applied = false; ST.aiText = '';
  var entry = {
    date:new Date().toLocaleDateString('en-IN'),time:new Date().toLocaleTimeString('en-IN'),
    signal:ST.alloc._signal,zone:ST.alloc._zone,pe:fd.niftyPE,vix:fd.vix,mom:ST.alloc._mom,
    alloc:{momentum:ST.alloc.momentum,quality:ST.alloc.quality,value:ST.alloc.value,lowvol:ST.alloc.lowvol,gold:ST.alloc.gold},
    sipAmt:ST.sipAmt,isLive:fd.isLive,source:fd.source
  };
  saveH(entry); ST.history = loadH();
  startCountdown();
  if(ST.notif==='granted' && __swReg && __swReg.active) {
    __swReg.active.postMessage({type:'SCHEDULE',ms:604800000});
  }
  var badge = fd.source==='yahoo'?'Yahoo Finance':fd.source==='nse'?'NSE':'Demo';
  showToast(data?('\u2705 '+badge+' \u00B7 '+fd.fetchedAt):'\u26A0\uFE0F Demo data \u2014 markets may be closed');
  ST.fetching = false;
  btn.disabled = false;
  lbl.textContent = fd.isLive ? fd.fetchedAt : 'Get Live Data';
  dot.className = fd.isLive ? 'live-dot' : 'demo-dot';
  msg.style.display = 'none';
  render();
}

// DONUT SVG
function makeDonut(alloc, size) {
  size = size || 130;
  var cx=size/2, cy=size/2, r=size*0.36, sw=size*0.14;
  var C={momentum:'#f97316',quality:'#38bdf8',value:'#a78bfa',lowvol:'#34d399',gold:'#fbbf24'};
  var cum=-90, paths='';
  FUNDS.forEach(function(f){
    var angle=(alloc[f.key]/100)*360;
    if(angle>0.5){
      var sr=cum*Math.PI/180, er=(cum+angle)*Math.PI/180;
      var x1=cx+r*Math.cos(sr), y1=cy+r*Math.sin(sr);
      var x2=cx+r*Math.cos(er), y2=cy+r*Math.sin(er);
      var lg=angle>180?1:0;
      paths+='<path d="M '+x1.toFixed(2)+' '+y1.toFixed(2)+' A '+r+' '+r+' 0 '+lg+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+'" fill="none" stroke="'+C[f.key]+'" stroke-width="'+sw+'" stroke-linecap="butt" opacity="0.9"/>';
    }
    cum+=angle;
  });
  var sm = SIG[alloc._signal]||SIG.NEUTRAL;
  return '<svg width="'+size+'" height="'+size+'" style="flex-shrink:0">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="'+sw+'"/>'+
    paths+
    '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" fill="#e2e8f0" font-size="'+(size*0.15)+'" font-family="Syne,sans-serif" font-weight="800">'+sm.icon+'</text>'+
    '</svg>';
}

  try {
    var sig=ST.signals, alloc=ST.alloc;
    var prompt = 'You are an Indian quant fund advisor. NSE data: Nifty='+fmt(sig.nifty50)+', PE='+sig.niftyPE+', VIX='+sig.vix+', Zone='+ZONE[alloc._zone]+', Signal='+((SIG[alloc._signal]||{}).label)+', Momentum='+alloc._mom+'/100, SIP=\u20B9'+ST.sipAmt.toLocaleString('en-IN')+'. Allocation: Momentum='+alloc.momentum+'%, Quality='+alloc.quality+'%, Value='+alloc.value+'%, LowVol='+alloc.lowvol+'%, Gold='+alloc.gold+'%. In 4-5 lines explain why each factor has this exact weight right now. Be specific about PE and VIX values. Simple language for retail Indian investors.';
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    var d = await res.json();
    ST.aiText = (d.content||[]).map(function(b){return b.text||'';}).join('') || 'No response.';
  } catch(e) {
    ST.aiText = 'Could not reach AI. Check your connection.';
  }
  ST.aiLoad=false; render();
}

// MAIN RENDER
function render() {
  var t = ST.tab;
  if(t==='home')    renderHome();
  if(t==='alloc')   renderAlloc();
  if(t==='signals') renderSignals();
  if(t==='history') renderHistory();
  if(t==='ai')      renderAi();
}

// SET TAB
function setTab(id) {
  ST.tab = id;
  TABS.forEach(function(t){
    var el = document.getElementById('tab'+t.id.charAt(0).toUpperCase()+t.id.slice(1));
    if(el) el.style.display = t.id===id ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(function(btn,i){
    var active = TABS[i] && TABS[i].id===id;
    var icon  = btn.querySelector('.nav-icon');
    var label = btn.querySelector('.nav-label');
    var dot   = btn.querySelector('.nav-dot');
    if(icon)  icon.className  = 'nav-icon'  + (active?' active':'');
    if(label) label.className = 'nav-label' + (active?' active':'');
    if(dot)   dot.style.display = active ? 'block' : 'none';
  });
  render();
}

// INIT
(function(){
  try {
    if('Notification' in window) ST.notif = Notification.permission;

    // Build nav
    var nav = document.getElementById('bottomNav');
    nav.innerHTML = TABS.map(function(t,i){
      var active = i===0;
      return '<button class="nav-btn" onclick="setTab(\''+t.id+'\')">'
        +'<div class="nav-icon'+(active?' active':'')+'">'+t.icon+'</div>'
        +'<div class="nav-label'+(active?' active':'')+'">'+t.label+'</div>'
        +'<div class="nav-dot" style="display:'+(active?'block':'none')+'"></div>'
        +'</button>';
    }).join('');

    // Wire fetch button
    document.getElementById('fetchBtn').addEventListener('click', doFetch);

    // Auto-refresh every 5 min
    setInterval(function(){doFetch();}, 5*60*1000);

    // Initial render
    render();
    console.log('FactorFlow initialized OK');
  } catch(e) {
    document.body.innerHTML = '<div style="padding:40px;color:#f87171;font-family:monospace;background:#070b12;min-height:100vh"><h2>Startup Error</h2><pre>'+e.message+'</pre><p>'+e.stack+'</p></div>';
  }
})();
</script>
</body>
