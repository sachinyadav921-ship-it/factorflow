  // Yahoo Finance query for Nifty 50 (^NSEI) and India VIX (^INDIAVIX)
  const CORS = 'https://api.allorigins.win/raw?url=';
  const NSEI_URL  = 'https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1d&range=1d';
  const VIX_URL   = 'https://query1.finance.yahoo.com/v8/finance/chart/%5EINDIAVIX?interval=1d&range=1d';
  const PE_URL    = 'https://query1.finance.yahoo.com/v10/finance/quoteSummary/%5ENSEI?modules=defaultKeyStatistics,summaryDetail';

  try {
    const [nRes, vRes, peRes] = await Promise.all([
      fetch(CORS + encodeURIComponent(NSEI_URL), { signal: AbortSignal.timeout(8000) }),
      fetch(CORS + encodeURIComponent(VIX_URL),  { signal: AbortSignal.timeout(8000) }),
      fetch(CORS + encodeURIComponent(PE_URL),   { signal: AbortSignal.timeout(8000) }),
    ]);

    if (!nRes.ok) return null;

    const nData  = await nRes.json();
    const vData  = vRes.ok ? await vRes.json() : null;
    const peData = peRes.ok ? await peRes.json() : null;

    const meta   = nData?.chart?.result?.[0]?.meta;
    if (!meta) return null;

    const price    = parseFloat(meta.regularMarketPrice   ?? 22187);
    const prevClose= parseFloat(meta.chartPreviousClose   ?? price);
    const open     = parseFloat(meta.regularMarketOpen    ?? price);
    const high     = parseFloat(meta.regularMarketDayHigh ?? price);
    const low      = parseFloat(meta.regularMarketDayLow  ?? price);
    const chgPct   = ((price - prevClose) / prevClose * 100);

    // P/E from Yahoo summary or estimate
    const stats    = peData?.quoteSummary?.result?.[0];
    const pe       = parseFloat(
      stats?.summaryDetail?.trailingPE?.raw ??
      stats?.defaultKeyStatistics?.trailingEps?.raw ??
      21.4
    );
    const niftyPE  = isNaN(pe) || pe <= 0 || pe > 60 ? 21.4 : parseFloat(pe.toFixed(1));

    // VIX
    const vMeta  = vData?.chart?.result?.[0]?.meta;
    const vix    = parseFloat(vMeta?.regularMarketPrice ?? 13.8);
    const vPrev  = parseFloat(vMeta?.chartPreviousClose ?? vix);
    const vixChg = ((vix - vPrev) / vPrev * 100);

    // Approximate SMAs from 52w range (rough but functional without history)
    const w52high = parseFloat(meta.fiftyTwoWeekHigh ?? price * 1.15);
    const w52low  = parseFloat(meta.fiftyTwoWeekLow  ?? price * 0.85);
    const sma200  = Math.round((w52high + w52low) / 2);
    const sma50   = Math.round(sma200 * 1.02 + (price - sma200) * 0.3);

    return {
      nifty50:   Math.round(price),
      niftyPE:   niftyPE,
      niftyChg:  parseFloat(chgPct.toFixed(2)),
      niftyOpen: Math.round(open),
      niftyHigh: Math.round(high),
      niftyLow:  Math.round(low),
      sma50, sma200,
      vix:       parseFloat(vix.toFixed(1)),
      vixChg:    parseFloat(vixChg.toFixed(2)),
      fetchedAt: new Date().toLocaleTimeString('en-IN'),
      isLive:    true,
      source:    'yahoo',
    };
  } catch(e) { return null; }
}

async function fetchNSEFallback() {
  const PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
  ];
  for (const proxy of PROXIES) {
    try {
      const r = await fetch(
        proxy + encodeURIComponent('https://www.nseindia.com/api/equity-stockIndices?index=NIFTY%2050'),
        { headers:{ Accept:'application/json' }, signal: AbortSignal.timeout(7000) }
      );
      if (!r.ok) continue;
      const d = await r.json();
      const n = d?.data?.[0];
      if (!n) continue;
      const price = parseFloat(n.last ?? 22187);
      return {
        nifty50:   Math.round(price),
        niftyPE:   parseFloat(n.pe ?? 21.4),
        niftyChg:  parseFloat(n.pChange ?? 0),
        niftyOpen: parseFloat(n.open  ?? price),
        niftyHigh: parseFloat(n.high  ?? price),
        niftyLow:  parseFloat(n.low   ?? price),
        sma50:     Math.round(price * 0.972),
        sma200:    Math.round(price * 0.941),
        vix: 14.2, vixChg: 0,
        fetchedAt: new Date().toLocaleTimeString('en-IN'),
        isLive: true, source: 'nse',
      };
    } catch { continue; }
  }
  return null;
}

async function fetchLiveData() {
  // Try Yahoo first (most reliable from browser)
  const yahoo = await fetchYahooNifty();
  if (yahoo) return yahoo;
  // Try NSE proxy fallback
  const nse = await fetchNSEFallback();
  if (nse) return nse;
  // All failed — return null, app uses demo
  return null;
}

function getZone(pe) {
  if (pe < 18) return 'DEEP_VALUE';
  if (pe < 22) return 'FAIR_VALUE';
  if (pe < 26) return 'EXPENSIVE';
  return 'BUBBLE';
}
function getMomScore(price, s50, s200) {
  let s = 50;
  if (price > s50)  s += 20; else s -= 20;
  if (price > s200) s += 20; else s -= 20;
  if (s50 > s200)   s += 10; else s -= 10;
  return Math.max(0, Math.min(100, s));
}
function getSignal(pe, mom) {
  const z = getZone(pe);
  if (z==='DEEP_VALUE' && mom>=60) return 'STRONG_BULL';
  if (z==='DEEP_VALUE')            return 'BULL';
  if (z==='FAIR_VALUE' && mom>=60) return 'BULL';
  if (z==='FAIR_VALUE' && mom<40)  return 'NEUTRAL';
  if (z==='FAIR_VALUE')            return 'NEUTRAL';
  if (z==='EXPENSIVE' && mom>=60)  return 'NEUTRAL';
  if (z==='EXPENSIVE' && mom<40)   return 'BEAR';
  if (z==='EXPENSIVE')             return 'BEAR';
  return 'STRONG_BEAR';
}
function computeAlloc(sig) {
  const p=sig.nifty50||22187, s50=sig.sma50||Math.round(p*0.972), s200=sig.sma200||Math.round(p*0.941);
  const mom=getMomScore(p,s50,s200), signal=getSignal(sig.niftyPE,mom), zone=getZone(sig.niftyPE);
  const BASE={
    STRONG_BULL:{momentum:38,quality:20,value:27,lowvol:8, gold:7 },
    BULL:       {momentum:28,quality:24,value:25,lowvol:10,gold:13},
    NEUTRAL:    {momentum:18,quality:28,value:22,lowvol:14,gold:18},
    BEAR:       {momentum:8, quality:28,value:16,lowvol:20,gold:28},
    STRONG_BEAR:{momentum:4, quality:22,value:12,lowvol:18,gold:44},
  };
  let a={...BASE[signal]};
  if(sig.vix>20){
    const sh=Math.min(8,Math.round((sig.vix-20)*0.8));
    a.momentum=Math.max(2,a.momentum-sh);
    a.lowvol=Math.min(30,a.lowvol+Math.round(sh*0.6));
    a.gold=Math.min(50,a.gold+Math.round(sh*0.4));
  }
  const sum=Object.values(a).reduce((x,y)=>x+y,0);
  if(sum!==100) a.quality+=(100-sum);
  return{...a,_signal:signal,_zone:zone,_mom:mom};
}

function Donut({alloc,size=130}){
  const cx=size/2,cy=size/2,r=size*0.36,sw=size*0.14;
  const C={momentum:'#f97316',quality:'#38bdf8',value:'#a78bfa',lowvol:'#34d399',gold:'#fbbf24'};
  let cum=-90;
  const slices=FUNDS.map(f=>{const angle=(alloc[f.key]/100)*360,s=cum;cum+=angle;return{...f,angle,start:s};});
  function arc(cx,cy,r,s,a){
    const sr=s*Math.PI/180,er=(s+a)*Math.PI/180;
    return `M ${cx+r*Math.cos(sr)} ${cy+r*Math.sin(sr)} A ${r} ${r} 0 ${a>180?1:0} 1 ${cx+r*Math.cos(er)} ${cy+r*Math.sin(er)}`;
  }
  const sm=SIG[alloc._signal]||SIG.NEUTRAL;
  return(
    <svg width={size} height={size}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth={sw}/>
      {slices.map((sl,i)=>sl.angle>0.5&&<path key={i} d={arc(cx,cy,r,sl.start,sl.angle)} fill="none" stroke={C[sl.key]} strokeWidth={sw} strokeLinecap="butt" opacity={0.9}/>)}
      <text x={cx} y={cy-4}  textAnchor="middle" fill="#e2e8f0" fontSize={size*0.12} fontFamily="Syne" fontWeight="800">{sm.icon}</text>
      <text x={cx} y={cy+13} textAnchor="middle" fill="#64748b" fontSize={size*0.055}>{sm.label}</text>
    </svg>
  );
}

              <div>
                <div style={{...S.label,marginBottom:'4px'}}>NIFTY 50</div>
                <div style={{...S.syne,fontSize:'32px',fontWeight:800,lineHeight:1}}>{signals.nifty50.toLocaleString('en-IN')}</div>
                <div style={{fontSize:'12px',color:signals.niftyChg>=0?'#34d399':'#f87171',marginTop:'4px',fontWeight:600}}>{signals.niftyChg>=0?'▲':'▼'} {Math.abs(signals.niftyChg).toFixed(2)}% today</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{...S.label,marginBottom:'2px'}}>PE RATIO</div>
                <div style={{...S.syne,fontSize:'26px',fontWeight:800,color:peColor}}>{signals.niftyPE}</div>
                <div style={{fontSize:'10px',color:peColor,fontWeight:600,marginTop:'2px'}}>{peLabel}</div>
              </div>
            </div>
            {signals.isLive&&<div style={{display:'flex',gap:'8px',paddingTop:'10px',borderTop:'1px solid rgba(255,255,255,0.04)'}}>
              {[['Open',signals.niftyOpen],['High',signals.niftyHigh],['Low',signals.niftyLow]].map(([l,v])=>(
                <div key={l} style={{flex:1,textAlign:'center',background:'rgba(255,255,255,0.02)',borderRadius:'8px',padding:'6px'}}>
                  <div style={{...S.label,marginBottom:'2px'}}>{l}</div>
                  <div style={{fontSize:'11px',fontWeight:600}}>{(v||0).toLocaleString('en-IN')}</div>
                </div>
              ))}
            </div>}
          </div>

          {/* VIX + SIP */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}}>
            <div style={{background:'rgba(255,255,255,0.02)',border:`1px solid ${vixColor}20`,borderRadius:'12px',padding:'13px'}}>
              <div style={{...S.label,marginBottom:'3px'}}>INDIA VIX</div>
              <div style={{...S.syne,fontSize:'22px',fontWeight:800,color:vixColor}}>{signals.vix}</div>
              <div style={{fontSize:'10px',color:vixColor,fontWeight:600,marginTop:'2px'}}>{vixLabel}</div>
            </div>
            <div style={{background:'rgba(255,255,255,0.02)',border:'1px solid rgba(251,191,36,0.15)',borderRadius:'12px',padding:'13px'}}>
              <div style={{...S.label,marginBottom:'6px'}}>MONTHLY SIP ₹</div>
              <input type="number" value={sipAmt} min={500} step={500} onChange={e=>setSipAmt(parseInt(e.target.value)||500)}
                style={{background:'transparent',border:'none',outline:'none',...S.syne,fontSize:'18px',fontWeight:800,color:'#fbbf24',width:'100%'}}/>
              <div style={{fontSize:'10px',color:'#475569',marginTop:'4px'}}>Tap to change</div>
            </div>
          </div>

          {/* Mini allocation */}
          <div style={{...S.card}}>
            <div style={{...S.label,marginBottom:'12px'}}>AUTO ALLOCATION</div>
            {FUNDS.map(f=>(
              <div key={f.key} style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'8px'}}>
                <span style={{fontSize:'14px',width:'20px',textAlign:'center'}}>{f.icon}</span>
                <div style={{flex:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:'3px'}}>
                    <span style={{fontSize:'11px',color:'#94a3b8'}}>{f.label}</span>
                    <span style={{fontSize:'12px',fontWeight:700,color:f.color,...S.syne}}>{alloc[f.key]}%</span>
                  </div>
                  <Bar pct={alloc[f.key]} color={f.color}/>
                </div>
              </div>
            ))}
          </div>

          {/* Countdown */}
          {nextRun&&<div style={{...S.card}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
              <span style={{...S.label}}>NEXT REBALANCE IN</span>
              <span style={{fontSize:'13px',color:'#fbbf24',...S.mono,fontWeight:600}}>{countdown}</span>
            </div>
            <div style={{height:'4px',background:'rgba(255,255,255,0.05)',borderRadius:'2px',overflow:'hidden'}}><div style={{height:'100%',background:'linear-gradient(90deg,#fbbf24,#f97316)',borderRadius:'2px',width:`${timerPct}%`,transition:'width 1s linear'}}/></div>
          </div>}

          <button onClick={()=>setTab('alloc')} style={{width:'100%',padding:'14px',background:'linear-gradient(135deg,rgba(251,191,36,0.18),rgba(251,191,36,0.06))',border:'1px solid rgba(251,191,36,0.3)',borderRadius:'14px',color:'#fbbf24',fontWeight:700,fontSize:'14px',cursor:'pointer'}}>⚡ View Full Allocation →</button>
        </div>}

        {/* ════ ALLOCATE TAB ════ */}
        {tab==='alloc'&&<div style={{padding:'0 20px',animation:'fadeIn 0.3s ease'}}>
          <div style={{display:'flex',gap:'14px',alignItems:'center',background:'linear-gradient(135deg,rgba(15,23,42,0.95),rgba(20,32,54,0.6))',border:'1px solid rgba(255,255,255,0.04)',borderRadius:'18px',padding:'18px',marginBottom:'12px'}}>
            <Donut alloc={alloc} size={130}/>
            <div style={{flex:1}}>
              <div style={{...S.label,marginBottom:'8px'}}>RECOMMENDED MIX</div>
              {FUNDS.map(f=>(
                <div key={f.key} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'5px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'5px'}}><div style={{width:'7px',height:'7px',borderRadius:'50%',background:f.color}}/><span style={{fontSize:'12px',color:'#94a3b8'}}>{f.label}</span></div>
                  <span style={{fontSize:'13px',fontWeight:700,color:f.color,...S.syne}}>{alloc[f.key]}%</span>
                </div>
              ))}
            </div>
          </div>
          <div style={{background:'rgba(251,191,36,0.05)',border:'1px solid rgba(251,191,36,0.15)',borderRadius:'12px',padding:'12px 16px',marginBottom:'12px',display:'flex',alignItems:'center',gap:'12px'}}>
            <div style={{flex:1}}>
              <div style={{...S.label,marginBottom:'4px'}}>MONTHLY SIP</div>
              <input type="number" value={sipAmt} min={500} step={500} onChange={e=>setSipAmt(parseInt(e.target.value)||500)}
                style={{background:'transparent',border:'none',outline:'none',...S.syne,fontSize:'20px',fontWeight:800,color:'#fbbf24',width:'100%'}}/>
            </div>
            <div style={{fontSize:'22px'}}>₹</div>
          </div>
          {FUNDS.map(f=>{
            const delta=prev?alloc[f.key]-prev[f.key]:0;
            return(
              <div key={f.key} style={{background:'rgba(15,23,42,0.85)',border:`1px solid ${f.color}18`,borderLeft:`3px solid ${f.color}`,borderRadius:'14px',padding:'13px',marginBottom:'9px',animation:'slideIn 0.3s ease'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div>
                    <div style={{display:'flex',alignItems:'center',gap:'5px'}}>
                      <span style={{fontSize:'15px'}}>{f.icon}</span>
                      <span style={{fontSize:'13px',fontWeight:600}}>{f.label}</span>
                      {delta!==0&&<span style={{fontSize:'10px',fontWeight:700,color:delta>0?'#34d399':'#f87171',background:delta>0?'rgba(52,211,153,0.1)':'rgba(248,113,113,0.1)',borderRadius:'5px',padding:'1px 5px'}}>{delta>0?'▲':'▼'}{Math.abs(delta)}%</span>}
                    </div>
                    <div style={{fontSize:'10px',color:'#475569',marginTop:'2px'}}>{f.fund}</div>
                    <div style={{fontSize:'11px',color:'#fbbf24',marginTop:'3px',...S.mono}}>{rupee(f.key)}</div>
                  </div>
                  <div style={{...S.syne,fontSize:'26px',fontWeight:800,color:f.color}}>{alloc[f.key]}%</div>
                </div>
                <Bar pct={alloc[f.key]} color={f.color}/>
              </div>
            );
          }))}
          {!applied
            ?<button onClick={()=>{setApplied(true);showToast('✅ Allocation applied!');}} style={{width:'100%',padding:'14px',background:'linear-gradient(135deg,rgba(251,191,36,0.2),rgba(251,191,36,0.07))',border:'1px solid rgba(251,191,36,0.3)',borderRadius:'14px',color:'#fbbf24',fontWeight:700,fontSize:'14px',cursor:'pointer',marginTop:'4px'}}>⚡ Apply This Allocation</button>
            :<div style={{textAlign:'center',padding:'14px',color:'#34d399',fontWeight:600,fontSize:'13px',background:'rgba(52,211,153,0.06)',border:'1px solid rgba(52,211,153,0.2)',borderRadius:'14px',marginTop:'4px'}}>✓ Applied — rebalances on next SIP cycle</div>
          }
        </div>}

        {/* ════ SIGNALS TAB ════ */}
        {tab==='signals'&&<div style={{padding:'0 20px',animation:'fadeIn 0.3s ease'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'14px'}}>
            {[
              {label:'NIFTY PE',   value:signals.niftyPE,                         warn:peLabel,    col:peColor},
              {label:'INDIA VIX',  value:signals.vix,                             warn:vixLabel,   col:vixColor},
              {label:'NIFTY 50',   value:signals.nifty50.toLocaleString('en-IN'), warn:signals.niftyChg>=0?'Positive':'Negative',col:signals.niftyChg>=0?'#34d399':'#f87171'},
              {label:'MOM SCORE',  value:alloc._mom+'/100',                       warn:ZONE[alloc._zone],col:sm.color},
              {label:'SIGNAL',     value:sm.icon+' '+sm.label,                    warn:'Combined', col:sm.color},
              {label:'GOLD ALLOC', value:alloc.gold+'%',                          warn:'Dynamic',  col:'#fbbf24'},
            ].map((s,i)=>(
              <div key={i} style={{background:'rgba(255,255,255,0.02)',border:`1px solid ${s.col}20`,borderRadius:'12px',padding:'13px'}}>
                <div style={{...S.label,marginBottom:'3px'}}>{s.label}</div>
                <div style={{...S.syne,fontSize:'18px',fontWeight:800,color:s.col,margin:'2px 0'}}>{s.value}</div>
                <div style={{fontSize:'10px',color:s.col,fontWeight:600}}>{s.warn}</div>
              </div>
            ))}
          </div>
          <div style={{...S.card}}>
            <div style={{...S.label,marginBottom:'12px'}}>SIGNAL → ALLOCATION LOGIC</div>
            {[
              {icon:'📊',s:'PE > 24', e:'Gold ↑ + Value ↑',    d:'Overvalued → safe haven + value tilt'},
              {icon:'📉',s:'PE < 20', e:'Momentum ↑ + Gold ↓', d:'Undervalued → go aggressive on equity'},
              {icon:'😰',s:'VIX > 20',e:'Gold ↑ + LowVol ↑',   d:'High fear → defensive shift'},
              {icon:'⚡',s:'Mom>60',  e:'Momentum ↑',           d:'Strong trend → ride winners'},
              {icon:'🛡️',s:'Mom<40',  e:'Quality ↑ + LowVol ↑', d:'Weak trend → quality protection'},
            ].map((r,i)=>(
              <div key={i} style={{display:'flex',gap:'10px',marginBottom:'10px',alignItems:'flex-start'}}>
                <span style={{fontSize:'18px',flexShrink:0}}>{r.icon}</span>
                <div><div style={{fontSize:'12px',fontWeight:600,color:'#cbd5e1'}}>{r.s} → <span style={{color:'#fbbf24'}}>{r.e}</span></div><div style={{fontSize:'11px',color:'#475569',marginTop:'1px'}}>{r.d}</div></div>
              </div>
            ))}
          </div>
          <div style={{background:'rgba(251,191,36,0.05)',border:'1px solid rgba(251,191,36,0.15)',borderRadius:'12px',padding:'12px'}}>
            <div style={{fontSize:'11px',color:'#fbbf24',fontWeight:600,marginBottom:'6px'}}>📡 Data Sources</div>
            <div style={{fontSize:'12px',color:'#64748b',lineHeight:1.7}}><b style={{color:'#94a3b8'}}>🟢 Primary:</b> Yahoo Finance API (Nifty + VIX + PE)<br/><b style={{color:'#94a3b8'}}>🟡 Fallback:</b> NSE India via proxy<br/><b style={{color:'#94a3b8'}}>⚪ Demo:</b> Static data if both fail<br/>Auto-refreshes every 5 minutes.</div>
          </div>
        </div>}

        {/* ════ HISTORY TAB ════ */}
        {tab==='history'&&<div style={{padding:'0 20px',animation:'fadeIn 0.3s ease'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
            <div style={{...S.label}}>WEEKLY REBALANCING LOG</div>
            {history.length>0&&<button onClick={()=>{localStorage.removeItem('ff_h');setHistory([]);showToast('History cleared');}} style={{fontSize:'11px',color:'#475569',background:'none',border:'none',cursor:'pointer',...S.mono}}>Clear</button>}
          </div>
          {history.length===0
            ?<div style={{textAlign:'center',padding:'60px 20px',color:'#334155'}}>
                <div style={{fontSize:'48px',marginBottom:'16px',opacity:0.3}}>📋</div>
                <div style={{fontSize:'13px',...S.mono}}>No history yet.<br/>Fetch live data to begin.</div>
              </div>
            :history.map((h,i)=>{
              const hsm=SIG[h.signal]||SIG.NEUTRAL;
              return(
                <div key={i} style={{background:'rgba(15,23,42,0.85)',border:`1px solid ${hsm.color}18`,borderRadius:'14px',padding:'13px',marginBottom:'10px',animation:'slideIn 0.3s ease'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}}>
                    <div>
                      <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'3px'}}>
                        <span style={{fontSize:'14px'}}>{hsm.icon}</span>
                        <span style={{...S.syne,fontWeight:800,fontSize:'14px',color:hsm.color}}>{hsm.label}</span>
                        {h.isLive&&<span style={{fontSize:'9px',color:'#34d399',background:'rgba(52,211,153,0.1)',borderRadius:'4px',padding:'1px 5px'}}>{h.source?.toUpperCase()}</span>}
                      </div>
                      <div style={{fontSize:'11px',color:'#475569',...S.mono}}>{h.date} · {h.time}</div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontSize:'12px',fontWeight:700,color:'#fbbf24',...S.mono}}>₹{(h.sipAmt||0).toLocaleString('en-IN')}</div>
                      <div style={{fontSize:'10px',color:'#475569',marginTop:'2px'}}>PE {h.pe} · VIX {h.vix}</div>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                    {FUNDS.map(f=>(
                      <div key={f.key} style={{background:`${f.color}12`,border:`1px solid ${f.color}20`,borderRadius:'8px',padding:'4px 8px',fontSize:'11px',...S.mono}}>
                        <span style={{color:'#64748b'}}>{f.icon} </span>
                        <span style={{color:f.color,fontWeight:600}}>{h.alloc?.[f.key]??0}%</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })
          }
        </div>}

        {/* ════ AI TAB ════ */}
        {tab==='ai'&&<div style={{padding:'0 20px',animation:'fadeIn 0.3s ease'}}>
          <div style={{background:'rgba(99,102,241,0.07)',border:'1px solid rgba(99,102,241,0.18)',borderRadius:'16px',padding:'14px',marginBottom:'14px'}}>
            <div style={{...S.label,color:'#818cf8',marginBottom:'6px'}}>{srcBadge} · {sm.icon} {sm.label}</div>
            <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
              {[['PE',signals.niftyPE],['VIX',signals.vix],['Nifty',signals.nifty50.toLocaleString('en-IN')],['Mom',alloc._mom+'/100'],['Gold',alloc.gold+'%']].map(([k,v])=>(
                <div key={k}><span style={{color:'#475569',fontSize:'11px'}}>{k} </span><span style={{fontWeight:700,color:'#e2e8f0',fontSize:'13px',...S.mono}}>{v}</span></div>
              ))}
            </div>
          </div>
          <button onClick={askClaude} disabled={aiLoad} style={{width:'100%',padding:'14px',marginBottom:'14px',background:aiLoad?'rgba(255,255,255,0.02)':'linear-gradient(135deg,rgba(99,102,241,0.2),rgba(99,102,241,0.07))',border:'1px solid rgba(99,102,241,0.25)',borderRadius:'12px',color:aiLoad?'#475569':'#818cf8',fontWeight:700,fontSize:'13px',cursor:aiLoad?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
            {aiLoad?<><span style={{width:'14px',height:'14px',border:'2px solid #6366f1',borderTopColor:'transparent',borderRadius:'50%',display:'inline-block',animation:'spin 0.8s linear infinite'}}/> Analysing…</>:'✦ Ask Claude to Explain This Allocation'}
          </button>
          {aiText&&<div style={{background:'rgba(15,23,42,0.9)',border:'1px solid rgba(99,102,241,0.15)',borderRadius:'14px',padding:'16px',marginBottom:'14px',animation:'fadeIn 0.4s ease'}}>
            <div style={{...S.label,color:'#6366f1',marginBottom:'8px'}}>CLAUDE'S ANALYSIS</div>
            <div style={{fontSize:'13px',color:'#cbd5e1',lineHeight:1.85}}>{aiText}</div>
          </div>}
          <div style={{...S.label,marginBottom:'10px'}}>CURRENT ALLOCATION</div>
          {FUNDS.map(f=>(
            <div key={f.key} style={{display:'flex',gap:'10px',alignItems:'center',background:'rgba(255,255,255,0.02)',border:`1px solid ${f.color}15`,borderRadius:'12px',padding:'11px',marginBottom:'8px'}}>
              <span style={{fontSize:'20px'}}>{f.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:'12px',fontWeight:600}}>{f.label} <span style={{color:f.color,...S.syne,fontWeight:700}}>{alloc[f.key]}%</span><span style={{color:'#475569',fontSize:'11px',marginLeft:'6px',...S.mono}}>{rupee(f.key)}</span></div>
                <div style={{fontSize:'11px',color:'#475569'}}>{f.desc}</div>
              </div>
              <div style={{width:'60px'}}><Bar pct={alloc[f.key]} color={f.color}/></div>
            </div>
          ))}
        </div>}

      </div>

      {/* ── BOTTOM NAV ── */}
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'430px',background:'rgba(7,11,18,0.97)',borderTop:'1px solid rgba(255,255,255,0.05)',backdropFilter:'blur(20px)',display:'flex',zIndex:100}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'10px 0 13px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px'}}>
            <div style={{fontSize:'16px',opacity:tab===t.id?1:0.3,transition:'opacity 0.2s'}}>{t.icon}</div>
            <div style={{fontSize:'9px',fontWeight:600,color:tab===t.id?'#fbbf24':'#475569',letterSpacing:'0.3px'}}>{t.label}</div>
            {tab===t.id&&<div style={{width:'4px',height:'4px',borderRadius:'50%',background:'#fbbf24'}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
