<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#070b12;color:#e2e8f0;font-family:'DM Sans',sans-serif;overscroll-behavior:none;min-height:100vh}
::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.app{max-width:430px;margin:0 auto;padding-bottom:80px;position:relative;z-index:1}
.gl1{position:fixed;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.07),transparent 70%);pointer-events:none;z-index:0}
.gl2{position:fixed;bottom:-60px;left:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.05),transparent 70%);pointer-events:none;z-index:0}
.hdr{padding:20px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px}
.logo span{color:#fbbf24}
.sublbl{font-size:10px;color:#475569;letter-spacing:0.8px;font-family:'DM Mono',monospace;margin-top:2px}
.fbtn{display:flex;align-items:center;gap:6px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:20px;padding:7px 13px;color:#fbbf24;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.fbtn:disabled{color:#475569;cursor:not-allowed}

// ═══ ALLOCATION ENGINE ═══
function getZone(pe){return pe<18?'DEEP_VALUE':pe<22?'FAIR_VALUE':pe<26?'EXPENSIVE':'BUBBLE';}
function getMom(p,s50,s200){var s=50;if(p>s50)s+=20;else s-=20;if(p>s200)s+=20;else s-=20;if(s50>s200)s+=10;else s-=10;return Math.max(0,Math.min(100,s));}
function getSignal(pe,mom){var z=getZone(pe);if(z==='DEEP_VALUE'&&mom>=60)return'STRONG_BULL';if(z==='DEEP_VALUE')return'BULL';if(z==='FAIR_VALUE'&&mom>=60)return'BULL';if(z==='FAIR_VALUE'&&mom<40)return'NEUTRAL';if(z==='FAIR_VALUE')return'NEUTRAL';if(z==='EXPENSIVE'&&mom>=60)return'NEUTRAL';if(z==='EXPENSIVE'&&mom<40)return'BEAR';if(z==='EXPENSIVE')return'BEAR';return'STRONG_BEAR';}
function computeAlloc(sig){
  var p=sig.nifty50||22187,s50=sig.sma50||Math.round(p*0.972),s200=sig.sma200||Math.round(p*0.941);
  var mom=getMom(p,s50,s200),signal=getSignal(sig.niftyPE,mom),zone=getZone(sig.niftyPE);
  var vix=sig.vix||15;
  var pe=sig.niftyPE||21;
  // Use same targetAlloc logic as backtest for consistency
  // Map signal to phase
  var phaseMap={STRONG_BULL:'STRONG_BULL',BULL:'BULL',NEUTRAL:'SIDEWAYS',BEAR:'BEAR',STRONG_BEAR:'CRASH'};
  var ph=phaseMap[signal]||'SIDEWAYS';
  var ta=targetAlloc(ph,pe,vix);
  return{momentum:ta.m,quality:ta.q,value:ta.v,lowvol:ta.lv,gold:ta.g,_signal:signal,_zone:zone,_mom:mom};
}

function tout(ms){return new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);});}
function fetchRace(url,ms){return Promise.race([fetch(url,{headers:{'Accept':'application/json'}}),tout(ms)]);}
function parseNSEI(nD,vD,pD){var meta=nD&&nD.chart&&nD.chart.result&&nD.chart.result[0]&&nD.chart.result[0].meta;if(!meta||!meta.regularMarketPrice)return null;var price=parseFloat(meta.regularMarketPrice),prev=parseFloat(meta.chartPreviousClose||price),chg=((price-prev)/prev*100);var peNode=pD&&pD.quoteSummary&&pD.quoteSummary.result&&pD.quoteSummary.result[0]&&pD.quoteSummary.result[0].summaryDetail;var peRaw=peNode&&peNode.trailingPE&&peNode.trailingPE.raw;var pe=(peRaw&&peRaw>5&&peRaw<80)?parseFloat(peRaw.toFixed(1)):21.4;var vMeta=vD&&vD.chart&&vD.chart.result&&vD.chart.result[0]&&vD.chart.result[0].meta;var vix=parseFloat(((vMeta&&vMeta.regularMarketPrice)||13.8).toFixed(1));var w52h=parseFloat(meta.fiftyTwoWeekHigh||price*1.15),w52l=parseFloat(meta.fiftyTwoWeekLow||price*0.85);var sma200=Math.round((w52h+w52l)/2),sma50=Math.round(sma200*1.02+(price-sma200)*0.3);return{nifty50:Math.round(price),niftyPE:pe,niftyChg:parseFloat(chg.toFixed(2)),niftyOpen:Math.round(parseFloat(meta.regularMarketOpen||price)),niftyHigh:Math.round(parseFloat(meta.regularMarketDayHigh||price)),niftyLow:Math.round(parseFloat(meta.regularMarketDayLow||price)),sma50:sma50,sma200:sma200,vix:vix,vixChg:0,fetchedAt:new Date().toLocaleTimeString('en-IN'),isLive:true,source:'yahoo'};}
async function tryYahoo(proxy){try{var enc=encodeURIComponent,p=proxy||'';var N=p+enc('https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1d&range=1d');var V=p+enc('https://query2.finance.yahoo.com/v8/finance/chart/%5EINDIAVIX?interval=1d&range=1d');var P=p+enc('https://query1.finance.yahoo.com/v10/finance/quoteSummary/%5ENSEI?modules=summaryDetail');var r1=await fetchRace(N,8000);if(!r1.ok)return null;var nD=await r1.json();var r2=await fetchRace(V,6000);var vD=r2.ok?await r2.json():null;var r3=await fetchRace(P,6000);var pD=r3.ok?await r3.json():null;return parseNSEI(nD,vD,pD);}catch(e){return null;}}

function startCountdown(){clearInterval(cdTimer);var WEEK=7*24*60*60*1000;ST.nextRun=Date.now()+WEEK;cdTimer=setInterval(function(){var rem=Math.max(0,ST.nextRun-Date.now());var d=Math.floor(rem/86400000),h=Math.floor((rem%86400000)/3600000),m=Math.floor((rem%3600000)/60000),s=Math.floor((rem%60000)/1000);ST.countdown=d+'d '+pad2(h)+'h '+pad2(m)+'m '+pad2(s)+'s';ST.timerPct=(rem/WEEK)*100;var el=document.getElementById('cdVal'),bar=document.getElementById('cdBar');if(el)el.textContent=ST.countdown;if(bar)bar.style.width=ST.timerPct+'%';if(rem===0){clearInterval(cdTimer);doFetch(true);}},1000);}

// ── Market phase from 3-month rolling equity return
function detectPhase(roll3m){
  if(roll3m<-10) return'CRASH';
  if(roll3m<-5)  return'BEAR';
  if(roll3m>8)   return'STRONG_BULL';
  if(roll3m>3)   return'BULL';
  return'SIDEWAYS';
}

// ── Factor-specific returns based on market phase
// Each factor behaves differently per cycle phase
function factorReturns(baseEq,gR,dR,phase){
  var m,q,v,lv;
  if(phase==='CRASH'){
    // Momentum CRASHES in reversals (trend breaks hard)
    // Quality+LowVol defensive (fall less)
    // Value starts recovery buying late in crash
    m =baseEq*1.3 -0.020; // momentum gets destroyed in crash
    q =baseEq*0.65+0.004;  // quality defensive
    v =baseEq*0.80+0.003;  // value holds better than growth
    lv=baseEq*0.50+0.006;  // lowvol best protection
  } else if(phase==='BEAR'){
    m =baseEq*1.1 -0.006;
    q =baseEq*0.78+0.003;
    v =baseEq*0.88+0.003;
    lv=baseEq*0.62+0.004;
  } else if(phase==='SIDEWAYS'){
    // VALUE factor dominates in sideways/range-bound markets
    // Momentum useless when no trend
    m =baseEq*0.88;         // momentum underperforms sideways
    q =baseEq*1.06+0.002;
    v =baseEq*1.20+0.005;  // VALUE shines in sideways!
    lv=baseEq*0.96+0.001;
  } else if(phase==='BULL'){
    m =baseEq*1.28+0.007;  // momentum leads bull markets
    q =baseEq*0.95+0.002;
    v =baseEq*0.88+0.001;
    lv=baseEq*0.78;
  } else { // STRONG_BULL
    m =baseEq*1.45+0.012;  // momentum dominates strong bull
    q =baseEq*0.88+0.001;
    v =baseEq*0.78;
    lv=baseEq*0.68;
  }
  return{m:m,q:q,v:v,lv:lv,g:gR,d:dR};
}

// ── Smart allocation: phase + PE + VIX aware
function smartRotate(pe,phase,vix){
  // Base by phase — CORRECT factor rotation
  var alloc;
  if(phase==='CRASH')       alloc={m:0, q:25,v:30,lv:15,g:30}; // 0% momentum, buy value for recovery
  else if(phase==='BEAR')   alloc={m:5, q:30,v:25,lv:15,g:25}; // defensive, hunt value
  else if(phase==='SIDEWAYS')alloc={m:15,q:25,v:38,lv:12,g:10};// VALUE dominates sideways
  else if(phase==='BULL')    alloc={m:40,q:22,v:18,lv:10,g:10};// momentum rides trend
  else                       alloc={m:52,q:18,v:14,lv:8, g:8}; // STRONG_BULL: max momentum

  // PE overlay: shift equity->gold when expensive
  if(pe>28){var sh=Math.min(18,Math.round((pe-28)*3));alloc.m=Math.max(0,alloc.m-Math.round(sh*0.5));alloc.g=Math.min(55,alloc.g+sh);alloc.v=Math.max(5,alloc.v-Math.round(sh*0.3));alloc.q=Math.max(5,alloc.q-Math.round(sh*0.2));}
  else if(pe<18){var dip=Math.min(15,Math.round((18-pe)*2));alloc.g=Math.max(5,alloc.g-dip);alloc.m=Math.min(55,alloc.m+Math.round(dip*0.4));alloc.v=Math.min(42,alloc.v+Math.round(dip*0.3));}

  // VIX overlay: fear -> lowvol+gold
  if(vix>25){var f=Math.min(15,Math.round((vix-25)*1.5));alloc.m=Math.max(0,alloc.m-Math.round(f*0.5));alloc.lv=Math.min(30,alloc.lv+Math.round(f*0.4));alloc.g=Math.min(55,alloc.g+Math.round(f*0.4));alloc.v=Math.max(5,alloc.v-Math.round(f*0.3));}
  else if(vix>18){var f2=Math.round((vix-18)*0.8);alloc.lv=Math.min(25,alloc.lv+f2);alloc.m=Math.max(0,alloc.m-Math.round(f2*0.5));}

  // Normalize
  var sum=alloc.m+alloc.q+alloc.v+alloc.lv+alloc.g;
  alloc.q+=100-sum;
  return alloc;
}

function detectPhase(rec2, roll3, pe, vix) {
  if (rec2.length>=1 && rec2[rec2.length-1] < -5) return 'CRASH';
  if (rec2.length>=2 && rec2[rec2.length-1]<-2 && rec2[rec2.length-2]<-2) return 'BEAR';
  if (pe>40 && roll3<5) return 'BEAR';
  if (roll3>12) return 'STRONG_BULL';
  if (roll3>5)  return 'BULL';
  if (roll3<-8) return 'CRASH';
  if (roll3<-3) return 'BEAR';
  return 'SIDEWAYS';
}

function factorRet(eR, gR, dR, ph) {
  // Each factor behaves differently per market phase
  // Based on NSE factor index historical behavior
  var mr, qr, vr, lvr;
  if (ph==='STRONG_BULL') {
    mr=eR*2.3+0.009; qr=eR*0.92+0.002; vr=eR*0.82+0.001; lvr=eR*0.68;
  } else if (ph==='BULL') {
    mr=eR*1.7+0.006; qr=eR*0.96+0.002; vr=eR*0.88+0.002; lvr=eR*0.75+0.001;
  } else if (ph==='SIDEWAYS') {
    mr=eR*0.75-0.001; qr=eR*1.05+0.003; vr=eR*1.30+0.006; lvr=eR*0.92+0.002;
  } else if (ph==='BEAR') {
    mr=eR*1.2-0.004; qr=eR*0.70+0.003; vr=eR*0.80+0.002; lvr=eR*0.55+0.005;
  } else { // CRASH
    mr=eR*1.6-0.015; qr=eR*0.58+0.006; vr=eR*0.68+0.004; lvr=eR*0.42+0.009;
  }
  return {mr:mr, qr:qr, vr:vr, lvr:lvr};
}

function targetAlloc(ph, pe, vix) {
  // Target allocation % — monthly rebalancing to these weights
  var a;
  if      (ph==='STRONG_BULL') a={m:62,q:15,v:10,lv:5, g:8};
  else if (ph==='BULL')        a={m:48,q:20,v:16,lv:7, g:9};
  else if (ph==='SIDEWAYS')    a={m:10,q:28,v:44,lv:10,g:8};
  else if (ph==='BEAR')        a={m:3, q:22,v:18,lv:27,g:30};
  else                         a={m:0, q:18,v:15,lv:30,g:37}; // CRASH: max protection
  // PE overlay
  if (pe>28) {
    var sh=Math.min(18,Math.round((pe-28)*2.5));
    a.m=Math.max(0,a.m-Math.round(sh*0.5)); a.g=Math.min(55,a.g+sh);
    a.q=Math.max(5,a.q-Math.round(sh*0.3)); a.v=Math.max(5,a.v-Math.round(sh*0.2));
  } else if (pe<18) {
    var dip=Math.min(15,Math.round((18-pe)*2)); a.g=Math.max(5,a.g-dip);
    a.m=Math.min(68,a.m+Math.round(dip*0.5)); a.v=Math.min(48,a.v+Math.round(dip*0.3));
  }
  // VIX overlay
  if (vix>26) {
    var f=Math.min(18,Math.round((vix-26)*2));
    a.m=Math.max(0,a.m-Math.round(f*0.5)); a.lv=Math.min(45,a.lv+Math.round(f*0.45));
    a.g=Math.min(55,a.g+Math.round(f*0.35)); a.v=Math.max(5,a.v-Math.round(f*0.2));
  } else if (vix>20) {
    var f2=Math.round((vix-20)*0.9);
    a.m=Math.max(0,a.m-Math.round(f2*0.4)); a.lv=Math.min(40,a.lv+Math.round(f2*0.5));
  }
  var total=a.m+a.q+a.v+a.lv+a.g; a.q+=100-total;
  return a;
}

function runBacktest(sip) {
  sip = sip || 10000;
  // Smart SIP: monthly rebalanced factor portfolio
  var sMom=0, sQ=0, sV=0, sLv=0, sGold=0;
  // Fixed SIP: 60% Nifty + 20% Midcap + 20% Debt
  var fEq=0, fMid=0, fDebt=0;
  var sInv=0, fInv=0;
  var smartPts=[], fixedPts=[], labels=[];
  var yearData={}, smartMonthly=[], fixedMonthly=[];
  var rec2=[], rec3=[];

  BDATA.forEach(function(row, idx) {
    var yr=row[0],mo=row[1],pe=row[2],eR=row[3]/100,gR=row[4]/100,dR=row[5]/100;
    rec2.push(eR*100); rec3.push(eR*100);
    if(rec2.length>2) rec2.shift();
    if(rec3.length>3) rec3.shift();
    var roll3=rec3.reduce(function(a,b){return a+b;},0);
    var vix=eR<-0.07?32:eR<-0.04?28:eR<-0.02?23:eR>0.05?13:15;

    var ph = detectPhase(rec2, roll3, pe, vix);
    var fr = factorRet(eR, gR, dR, ph);

    // Step 1: Grow all factor slices with their specific returns
    sMom  *= (1+fr.mr);
    sQ    *= (1+fr.qr);
    sV    *= (1+fr.vr);
    sLv   *= (1+fr.lvr);
    sGold *= (1+gR);

    // Step 2: Add new monthly SIP
    var newTotal = sMom+sQ+sV+sLv+sGold + sip;
    sInv += sip;

    // Step 3: REBALANCE entire portfolio to target weights
    // This is the key — when phase changes, we shift the whole corpus
    var ta = targetAlloc(ph, pe, vix);
    sMom  = newTotal * (ta.m /100);
    sQ    = newTotal * (ta.q /100);
    sV    = newTotal * (ta.v /100);
    sLv   = newTotal * (ta.lv/100);
    sGold = newTotal * (ta.g /100);

    // Fixed SIP: no rebalancing, just buy and hold
    fEq   *= (1+eR); fMid *= (1+eR+0.003); fDebt *= (1+dR);
    fEq   += sip*0.60; fMid += sip*0.20; fDebt += sip*0.20; fInv += sip;

    var sv=Math.round(sMom+sQ+sV+sLv+sGold), fv=Math.round(fEq+fMid+fDebt);
    smartMonthly.push(sv); fixedMonthly.push(fv);
    if(mo%3===0){labels.push(yr+' Q'+Math.ceil(mo/3));smartPts.push(sv);fixedPts.push(fv);}
    if(mo===12) yearData[yr]={smart:sv,fixed:fv,phase:ph};
  });

  var sFinal=Math.round(sMom+sQ+sV+sLv+sGold), fFinal=Math.round(fEq+fMid+fDebt);
  var yrs=BDATA.length/12;
  var sCagr=(Math.pow(sFinal/sInv,1/yrs)-1)*100;
  var fCagr=(Math.pow(fFinal/fInv,1/yrs)-1)*100;

  // Crash drawdown analysis
  var CRASH_IDX=[{si:18,ei:26,name:'2015-16 Crash'},{si:48,ei:59,name:'2018 Correction'},{si:74,ei:77,name:'2020 COVID'},{si:96,ei:107,name:'2022 Bear'}];
  var crashData=CRASH_IDX.map(function(c){
    var sp=0,st=Infinity,fp=0,ft=Infinity;
    for(var i=c.si;i<=c.ei&&i<smartMonthly.length;i++){
      sp=Math.max(sp,smartMonthly[i]); st=Math.min(st,smartMonthly[i]);
      fp=Math.max(fp,fixedMonthly[i]); ft=Math.min(ft,fixedMonthly[i]);
    }
    var sDD=sp>0?(sp-st)/sp*100:0, fDD=fp>0?(fp-ft)/fp*100:0;
    return{name:c.name,sDD:sDD,fDD:fDD,saved:fDD-sDD};
  });

  return{labels,smartPts,fixedPts,sFinal,fFinal,sCagr,fCagr,invested:Math.round(sInv),yearData,crashData};
}

function drawLineChart(id,labels,datasets){
  var canvas=document.getElementById(id);if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.offsetWidth||340;canvas.width=W;canvas.height=200;
  var H=canvas.height,pad={t:20,r:16,b:36,l:58},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  var allV=[];datasets.forEach(function(d){allV=allV.concat(d.data);});
  var maxV=Math.max.apply(null,allV)*1.08;
  function xp(i){return pad.l+(i/(labels.length-1))*cW;}
  function yp(v){return pad.t+cH-(v/maxV)*cH;}
  for(var g=0;g<=4;g++){var gy=pad.t+(g/4)*cH,gv=maxV*(1-g/4);ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(pad.l+cW,gy);ctx.stroke();ctx.fillStyle='#475569';ctx.font='10px DM Mono,monospace';ctx.textAlign='right';ctx.fillText('\u20B9'+(gv>=100000?(gv/100000).toFixed(0)+'L':(gv/1000).toFixed(0)+'K'),pad.l-5,gy+4);}
  var step=Math.floor(labels.length/5);ctx.fillStyle='#475569';ctx.font='9px DM Mono,monospace';ctx.textAlign='center';
  for(var xi=0;xi<labels.length;xi+=step)ctx.fillText(labels[xi].slice(0,4),xp(xi),H-pad.b+14);
  datasets.forEach(function(ds,di){
    ctx.beginPath();ds.data.forEach(function(v,i){i===0?ctx.moveTo(xp(i),yp(v)):ctx.lineTo(xp(i),yp(v));});ctx.lineTo(xp(ds.data.length-1),pad.t+cH);ctx.lineTo(xp(0),pad.t+cH);ctx.closePath();ctx.fillStyle=ds.color+'20';ctx.fill();
    ctx.beginPath();ctx.strokeStyle=ds.color;ctx.lineWidth=2.5;ctx.lineJoin='round';ds.data.forEach(function(v,i){i===0?ctx.moveTo(xp(i),yp(v)):ctx.lineTo(xp(i),yp(v));});ctx.stroke();
    var lv=ds.data[ds.data.length-1];ctx.beginPath();ctx.arc(xp(ds.data.length-1),yp(lv),5,0,Math.PI*2);ctx.fillStyle=ds.color;ctx.fill();
    ctx.fillStyle=ds.color;ctx.font='bold 10px DM Mono,monospace';ctx.textAlign=di===0?'right':'left';ctx.fillText('\u20B9'+(lv/100000).toFixed(1)+'L',xp(ds.data.length-1)+(di===0?-8:8),yp(lv)-8);
  });
}

function drawDrawdownChart(id,crashData){
  var canvas=document.getElementById(id);if(!canvas||!crashData.length)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.offsetWidth||340;canvas.width=W;canvas.height=180;
  var H=canvas.height,pad={t:30,r:16,b:28,l:16},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  var maxDD=Math.max.apply(null,crashData.map(function(c){return Math.max(c.sDD,c.fDD);}));
  maxDD=Math.ceil(maxDD/5)*5||30;
  var n=crashData.length,gW=cW/n,bW=gW*0.28;
  crashData.forEach(function(c,i){

  h+='<div class="card"><div style="display:flex;justify-content:space-between;font-size:10px;color:#475569;font-family:\'DM Mono\',monospace;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.06)"><span>YEAR</span><span style="color:#34d399">SMART</span><span style="color:#38bdf8">FIXED</span><span>EDGE</span></div>';
  Object.keys(bt.yearData).sort().forEach(function(yr){var yd=bt.yearData[yr],edge=yd.smart-yd.fixed,eStr=edge>=0?'+&#8377;'+(edge/1000).toFixed(0)+'K':'-&#8377;'+(Math.abs(edge)/1000).toFixed(0)+'K';h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="font-size:12px;color:#64748b;font-family:\'DM Mono\',monospace">'+yr+'</span><span style="font-size:12px;color:#34d399;font-family:\'DM Mono\',monospace">&#8377;'+(yd.smart/100000).toFixed(1)+'L</span><span style="font-size:12px;color:#38bdf8;font-family:\'DM Mono\',monospace">&#8377;'+(yd.fixed/100000).toFixed(1)+'L</span><span style="font-size:11px;color:'+(edge>=0?'#34d399':'#f87171')+';font-weight:700;font-family:\'DM Mono\',monospace">'+eStr+'</span></div>';});
  h+='</div>';
  h+='<div style="background:rgba(251,191,36,0.05);border:1px solid rgba(251,191,36,0.15);border-radius:12px;padding:12px;margin-bottom:4px"><div style="font-size:11px;color:#fbbf24;font-weight:600;margin-bottom:8px">&#128208; Why Smart SIP Wins ('+bt.sCagr.toFixed(1)+'% vs '+bt.fCagr.toFixed(1)+'% CAGR)</div><div style="font-size:11px;color:#64748b;line-height:1.9"><b style="color:#a78bfa">Sideways markets:</b> Value factor rotated to 38% &mdash; beats stagnant broad index<br/><b style="color:#f97316">Bull markets:</b> Momentum at 40-52% &mdash; rides trend hard<br/><b style="color:#f87171">Crash:</b> Momentum = 0%, Value = 30% &mdash; buys cheap for next bull<br/><b style="color:#fbbf24">PE>28:</b> Shifts 18% to Gold &mdash; protects capital at bubble peaks<br/><b style="color:#34d399">Drawdown saved:</b> '+ddSaved.toFixed(1)+'% less loss on avg across 4 crashes</div></div>';
  document.getElementById('tabBacktest').innerHTML=h;
  setTimeout(function(){
    drawLineChart('btChart',bt.labels,[{data:bt.smartPts,color:'#34d399'},{data:bt.fixedPts,color:'#38bdf8'}]);
    drawDrawdownChart('ddChart',bt.crashData);
  },60);
}

// ═══ RENDER HISTORY ═══
function renderHistory(){
  var ha=ST.history;
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div class="lbl">WEEKLY REBALANCING LOG</div>'+(ha.length>0?'<button onclick="localStorage.removeItem(\'ff_h\');ST.history=[];showToast(\'Cleared\');render()" style="font-size:11px;color:#475569;background:none;border:none;cursor:pointer;font-family:\'DM Mono\',monospace">Clear</button>':'')+'</div>';
  if(!ha.length){h+='<div class="emp"><div style="font-size:48px;margin-bottom:16px;opacity:0.3">&#128203;</div><div style="font-size:13px;font-family:\'DM Mono\',monospace">No history yet.<br/>Fetch live data to begin.</div></div>';}
  else ha.forEach(function(e){var hsm=SIG[e.signal]||SIG.NEUTRAL;h+='<div class="hc" style="background:rgba(15,23,42,0.85);border:1px solid '+hsm.color+'22"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span class="syne" style="font-weight:800;font-size:14px;color:'+hsm.color+'">'+hsm.icon+' '+hsm.label+'</span>'+(e.isLive?'<span style="font-size:9px;color:#34d399;background:rgba(52,211,153,0.1);border-radius:4px;padding:1px 5px">'+(e.source||'LIVE').toUpperCase()+'</span>':'')+'</div><div class="mono" style="font-size:11px;color:#475569">'+esc(e.date)+' &middot; '+esc(e.time)+'</div></div><div style="text-align:right"><div class="mono" style="font-size:12px;font-weight:700;color:#fbbf24">&#8377;'+(e.sipAmt||0).toLocaleString('en-IN')+'</div><div style="font-size:10px;color:#475569;margin-top:2px">PE '+esc(e.pe)+' &middot; VIX '+esc(e.vix)+'</div></div></div><div style="display:flex;gap:6px;flex-wrap:wrap">'+FUNDS.map(function(f){return'<div class="tag" style="background:'+f.color+'22;border:1px solid '+f.color+'33"><span style="color:#64748b">'+f.icon+' </span><span style="color:'+f.color+';font-weight:600">'+((e.alloc&&e.alloc[f.key])||0)+'%</span></div>';}).join('')+'</div></div>';});
  document.getElementById('tabHistory').innerHTML=h;
}

// ═══ RENDER AI ═══
function renderAi(){
  var sig=ST.signals,alloc=ST.alloc,sm=SIG[alloc._signal]||SIG.NEUTRAL;
  var src=sig.source==='yahoo'?'Yahoo Finance':sig.source==='nse'?'NSE India':'Demo';
  var h='<div class="ai-box"><div class="lbl" style="color:#818cf8;margin-bottom:6px">'+esc(src)+' &middot; '+sm.icon+' '+sm.label+'</div><div style="display:flex;gap:14px;flex-wrap:wrap">'+[['PE',sig.niftyPE],['VIX',sig.vix],['Nifty',fmt(sig.nifty50)],['Mom',alloc._mom+'/100'],['Gold',alloc.gold+'%']].map(function(x){return'<div><span style="color:#475569;font-size:11px">'+x[0]+' </span><span class="mono" style="font-weight:700;color:#e2e8f0;font-size:13px">'+x[1]+'</span></div>';}).join('')+'</div></div>';
  h+='<button id="claudeBtn" class="ai-btn" style="background:'+(ST.aiLoad?'rgba(255,255,255,0.02)':'linear-gradient(135deg,rgba(99,102,241,0.2),rgba(99,102,241,0.07))')+';color:'+(ST.aiLoad?'#475569':'#818cf8')+'"'+(ST.aiLoad?' disabled':'')+'>'+( ST.aiLoad?'<span class="spin-el" style="border-color:#6366f1;border-top-color:transparent"></span> Analysing&hellip;':'&#10022; Ask Claude to Explain This Allocation')+'</button>';
  if(ST.aiText)h+='<div class="ai-res"><div class="lbl" style="color:#6366f1;margin-bottom:8px">CLAUDE\'S ANALYSIS</div><div style="font-size:13px;color:#cbd5e1;line-height:1.85">'+esc(ST.aiText)+'</div></div>';
  h+='<div class="lbl" style="margin-bottom:10px">CURRENT ALLOCATION</div>'+FUNDS.map(function(f){return'<div style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.02);border:1px solid '+f.color+'22;border-radius:12px;padding:11px;margin-bottom:8px"><span style="font-size:20px">'+f.icon+'</span><div style="flex:1"><div style="font-size:12px;font-weight:600">'+f.label+' <span class="syne" style="color:'+f.color+';font-weight:700">'+alloc[f.key]+'%</span><span class="mono" style="color:#475569;font-size:11px;margin-left:6px">'+inr(f.key)+'</span></div><div style="font-size:11px;color:#475569">'+f.desc+'</div></div><div style="width:60px"><div class="bbg"><div class="bfill" style="background:'+f.color+';width:'+alloc[f.key]+'%"></div></div></div></div>';}).join('');
  document.getElementById('tabAi').innerHTML=h;
  var cb=document.getElementById('claudeBtn');if(cb)cb.addEventListener('click',askClaude);
}

// ═══ ASK CLAUDE ═══
async function askClaude(){
  ST.aiLoad=true;ST.aiText='';render();
  try{
    var sig=ST.signals,alloc=ST.alloc,sm=SIG[alloc._signal]||SIG.NEUTRAL;
    var phaseDesc={STRONG_BULL:'Strong Bull - max momentum',BULL:'Bull - high momentum',NEUTRAL:'Sideways - value dominates',BEAR:'Bear - quality+value defensive',STRONG_BEAR:'Crash - 0% momentum, recovery buying'};
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:'You are an Indian quant fund advisor. NSE data: Nifty='+fmt(sig.nifty50)+' ('+sig.niftyChg+'%), PE='+sig.niftyPE+', VIX='+sig.vix+', Market Phase='+phaseDesc[alloc._signal]+', SIP=Rs'+ST.sipAmt.toLocaleString('en-IN')+'. Factor allocation: Momentum='+alloc.momentum+'%, Quality='+alloc.quality+'%, Value='+alloc.value+'%, LowVol='+alloc.lowvol+'%, Gold='+alloc.gold+'%. Explain in 5 lines: (1) why momentum is at this level given market phase, (2) why value is high/low given sideways/trending market, (3) what VIX='+sig.vix+' means for lowvol, (4) PE='+sig.niftyPE+' impact on gold, (5) overall strategy. Simple language for retail Indian investors.'}]})});
    var d=await res.json();
    ST.aiText=(d.content||[]).map(function(b){return b.text||'';}).join('')||'No response.';
  }catch(e){ST.aiText='Could not reach AI. Check your connection.';}
  ST.aiLoad=false;render();
}

// ═══ RENDER + TAB ═══
function render(){var t=ST.tab;if(t==='home')renderHome();if(t==='alloc')renderAlloc();if(t==='signals')renderSignals();if(t==='backtest')renderBacktest();if(t==='history')renderHistory();if(t==='ai')renderAi();}
function setTab(id){ST.tab=id;TABS.forEach(function(t){var el=document.getElementById(TABMAP[t.id]);if(el)el.style.display=t.id===id?'block':'none';});document.querySelectorAll('.nbtn').forEach(function(btn,i){var on=TABS[i]&&TABS[i].id===id;btn.querySelector('.ni').className='ni'+(on?' on':'');btn.querySelector('.nl').className='nl'+(on?' on':'');btn.querySelector('.nd').style.display=on?'block':'none';});render();}

// ═══ INIT ═══
(function(){
  try{
    if('Notification'in window)ST.notif=Notification.permission;
    var nav=document.getElementById('bnav');
    nav.innerHTML=TABS.map(function(t,i){var on=i===0;return'<button class="nbtn" onclick="setTab(\''+t.id+'\')">'+'<div class="ni'+(on?' on':'')+'">'+t.icon+'</div>'+'<div class="nl'+(on?' on':'')+'">'+t.label+'</div>'+'<div class="nd" style="display:'+(on?'block':'none')+'"></div>'+'</button>';}).join('');
    document.getElementById('fetchBtn').addEventListener('click',function(){doFetch(false);});
    render();
    setTimeout(function(){doFetch(true);},800);
    setInterval(function(){doFetch(true);},5*60*1000);
    console.log('FactorFlow v3 OK');
  }catch(e){
    document.body.innerHTML='<div style="padding:40px;color:#f87171;font-family:monospace;background:#070b12;min-height:100vh"><h2>Error</h2><pre>'+e.message+'</pre></div>';
  }
})();
