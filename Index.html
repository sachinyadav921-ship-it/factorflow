    console.warn('[FF] SW registration failed:', e);
    return null;
  }
}

// ── Request notification permission ──
async function requestNotificationPermission() {
  if (!('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'granted') return 'granted';
  if (Notification.permission === 'denied')  return 'denied';
  const result = await Notification.requestPermission();
  return result;
}

// ── Schedule local notification via SW message ──
async function scheduleRebalanceNotification(ms) {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.ready;
  if (reg.active) {
    reg.active.postMessage({ type: 'SCHEDULE_REBALANCE', ms });
  }
}

// ── Show immediate local notification ──
async function showLocalNotification(title, body, signal) {
  if (Notification.permission !== 'granted') return;
  const reg = await navigator.serviceWorker.ready;
  await reg.showNotification(title, {
    body,
    icon:  '/icon-192.png',
    badge: '/icon-192.png',
    tag:   'factorflow-rebalance',
    vibrate: [200, 100, 200],
    data:  { url: '/', signal },
  });
}

// ── Register Periodic Background Sync (Chrome Android) ──
async function registerPeriodicSync(reg) {
  if (!('periodicSync' in reg)) return;
  try {
    const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (status.state === 'granted') {
      await reg.periodicSync.register('weekly-rebalance', { minInterval: 7 * 24 * 60 * 60 * 1000 });
      console.log('[FF] Periodic sync registered');
    }
  } catch(e) { console.warn('[FF] Periodic sync failed:', e); }
}

async function fetchWithProxy(url) {
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy + encodeURIComponent(url), {
        headers: { Accept: 'application/json' },
        signal: AbortSignal.timeout(8000),
      });
      if (res.ok) {
        const text = await res.text();
        const data = JSON.parse(text);

async function fetchStooqFallback() {
  try {

// SECTION 3 — REBALANCING ENGINE
// ══════════════════════════════════════════════════════════

function getMarketZone(pe) {
  if (pe < 18) return 'DEEP_VALUE';
  if (pe < 22) return 'FAIR_VALUE';
  if (pe < 26) return 'EXPENSIVE';
  return 'BUBBLE';
}

function getMomentumScore({ currentPrice, sma50, sma200 }) {
  let score = 50;
  if (currentPrice > sma50)  score += 20; else score -= 20;
  if (currentPrice > sma200) score += 20; else score -= 20;
  if (sma50 > sma200)        score += 10; else score -= 10;
  return Math.max(0, Math.min(100, score));
}

function getMarketSignal(pe, momentumScore) {
  const zone = getMarketZone(pe);
  if (zone === 'DEEP_VALUE' && momentumScore >= 60) return 'STRONG_BULL';
  if (zone === 'DEEP_VALUE')                        return 'BULL';
  if (zone === 'FAIR_VALUE' && momentumScore >= 60) return 'BULL';
  if (zone === 'FAIR_VALUE' && momentumScore < 40)  return 'NEUTRAL';
  if (zone === 'FAIR_VALUE')                        return 'NEUTRAL';
  if (zone === 'EXPENSIVE'  && momentumScore >= 60) return 'NEUTRAL';
  if (zone === 'EXPENSIVE'  && momentumScore < 40)  return 'BEAR';
  if (zone === 'EXPENSIVE')                         return 'BEAR';
  return 'STRONG_BEAR';
}

function computeAllocation(sig) {
  const { niftyPE, vix, nifty50, sma50, sma200 } = sig;
  const price = nifty50 || 22187;
  const s50   = sma50   || Math.round(price * 0.972);
  const s200  = sma200  || Math.round(price * 0.941);

  const momentumScore = getMomentumScore({ currentPrice: price, sma50: s50, sma200: s200 });
  const signal        = getMarketSignal(niftyPE, momentumScore);
  const zone          = getMarketZone(niftyPE);

  const BASE = {
    STRONG_BULL: { momentum:38, quality:20, value:27, lowvol:8,  gold:7  },
    BULL:        { momentum:28, quality:24, value:25, lowvol:10, gold:13 },
    NEUTRAL:     { momentum:18, quality:28, value:22, lowvol:14, gold:18 },
    BEAR:        { momentum:8,  quality:28, value:16, lowvol:20, gold:28 },
    STRONG_BEAR: { momentum:4,  quality:22, value:12, lowvol:18, gold:44 },
  };

  let alloc = { ...BASE[signal] };

  // VIX overlay
  if (vix > 20) {
    const shift = Math.min(8, Math.round((vix - 20) * 0.8));
    alloc.momentum = Math.max(2,  alloc.momentum - shift);
    alloc.lowvol   = Math.min(30, alloc.lowvol   + Math.round(shift * 0.6));
    alloc.gold     = Math.min(50, alloc.gold      + Math.round(shift * 0.4));
  }

  const sum = Object.values(alloc).reduce((a,b) => a+b, 0);
  if (sum !== 100) alloc.quality += (100 - sum);

  return { ...alloc, _signal: signal, _zone: zone, _momentumScore: momentumScore };
}

function Donut({ alloc, size=140 }) {
  const cx=size/2, cy=size/2, r=size*0.36, sw=size*0.14;
  const C={momentum:'#f97316',quality:'#38bdf8',value:'#a78bfa',lowvol:'#34d399',gold:'#fbbf24'};
  let cum=-90;
  const slices=FUNDS.map(f=>{const angle=(alloc[f.key]/100)*360,s=cum;cum+=angle;return{...f,angle,start:s};});
  function arc(cx,cy,r,s,a){
    const sr=s*Math.PI/180,er=(s+a)*Math.PI/180;
    return `M ${cx+r*Math.cos(sr)} ${cy+r*Math.sin(sr)} A ${r} ${r} 0 ${a>180?1:0} 1 ${cx+r*Math.cos(er)} ${cy+r*Math.sin(er)}`;
  }
  const sm=SIGNAL_META[alloc._signal]||SIGNAL_META.NEUTRAL;
  return (
    <svg width={size} height={size}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth={sw}/>
      {slices.map((sl,i)=>sl.angle>0.5&&(<path key={i} d={arc(cx,cy,r,sl.start,sl.angle)} fill="none" stroke={C[sl.key]} strokeWidth={sw} strokeLinecap="butt" opacity={0.9}/>))}

              </div>
            )}

            <div style={{fontSize:'11px',color:'#475569',fontWeight:600,letterSpacing:'0.5px',marginBottom:'10px',fontFamily:"'DM Mono',monospace"}}>CURRENT ALLOCATION</div>
            {FUNDS.map(f=>(
              <div key={f.key} style={{display:'flex',gap:'10px',alignItems:'center',background:'rgba(255,255,255,0.02)',border:`1px solid ${f.color}15`,borderRadius:'12px',padding:'11px',marginBottom:'8px'}}>
                <span style={{fontSize:'20px'}}>{f.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:'12px',fontWeight:600}}>{f.label} <span style={{color:f.color,fontFamily:"'Syne',sans-serif",fontWeight:700}}>{alloc[f.key]}%</span>
                    <span style={{color:'#475569',fontSize:'11px',marginLeft:'6px',fontFamily:"'DM Mono',monospace"}}>{rupee(f.key)}</span>
                  </div>
                  <div style={{fontSize:'11px',color:'#475569'}}>{f.desc}</div>
                </div>
                <div style={{width:'60px'}}><Bar pct={alloc[f.key]} color={f.color}/></div>
              </div>
            ))}
          </div>
        )}

      </div>

      {/* ─── BOTTOM NAV ─── */}
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'430px',background:'rgba(7,11,18,0.97)',borderTop:'1px solid rgba(255,255,255,0.05)',backdropFilter:'blur(20px)',display:'flex',zIndex:100}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'10px 0 13px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px'}}>
            <div style={{fontSize:'16px',opacity:tab===t.id?1:0.3,transition:'opacity 0.2s'}}>{t.icon}</div>
            <div style={{fontSize:'9px',fontWeight:600,fontFamily:"'DM Sans',sans-serif",color:tab===t.id?'#fbbf24':'#475569',letterSpacing:'0.3px'}}>{t.label}</div>
            {tab===t.id&&<div style={{width:'4px',height:'4px',borderRadius:'50%',background:'#fbbf24'}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
