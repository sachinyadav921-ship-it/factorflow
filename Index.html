<body>
<div id="root"></div>
<script type="text/babel">

const {useState, useEffect} = React;

// ─── SAFE NUMBER ──────────────────────────────────────
function n(val, def) {
  const x = parseFloat(val);
  return (!isNaN(x) && x > 0) ? x : def;
}

// ─── FETCH LIVE NIFTY 50 ─────────────────────────────
async function getLiveData() {
  const proxies = [
    "https://api.allorigins.win/raw?url=",
    "https://corsproxy.io/?",
  ];
  const yahooUrl = "https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1d&range=1d";
  const vixUrl   = "https://query1.finance.yahoo.com/v8/finance/chart/%5EINDIAVIX?interval=1d&range=1d";

  for (let proxy of proxies) {
    try {
      const [nr, vr] = await Promise.all([
        fetch(proxy + encodeURIComponent(yahooUrl), {signal: AbortSignal.timeout(9000)}),
        fetch(proxy + encodeURIComponent(vixUrl),   {signal: AbortSignal.timeout(9000)}),
      ]);
      const nd = await nr.json();
      const vd = await vr.json();
      const nm = nd?.chart?.result?.[0]?.meta;
      const vm = vd?.chart?.result?.[0]?.meta;
      if (nm?.regularMarketPrice) {
        const price = nm.regularMarketPrice;
        const prev  = nm.chartPreviousClose || nm.previousClose || price;
        const chg   = +((price - prev) / prev * 100).toFixed(2);
        const vix   = n(vm?.regularMarketPrice, 13.8);
        const pe    = +(price / 1050).toFixed(1); // Nifty PE ≈ price/1050 in 2025
        return {
          nifty50:  Math.round(price),
          niftyChg: chg,
          niftyPE:  pe,
          vix:      vix,
          source:   proxy.includes("allorigins") ? "Yahoo/allorigins" : "Yahoo/corsproxy",
          time:     new Date().toLocaleTimeString("en-IN"),
          isLive:   true,
        };
      }
    } catch(e) { continue; }
  }
  return null;
}

// ─── ALLOCATION ENGINE ────────────────────────────────
function calcAlloc(pe, vix, mom3) {
  pe   = n(pe,   21.4);
  vix  = n(vix,  13.8);
  mom3 = isNaN(parseFloat(mom3)) ? 3 : parseFloat(mom3);

  const peS  = Math.min(Math.max((pe - 18) / 12, 0), 1);
  const vixS = Math.min(Math.max((vix - 12) / 24, 0), 1);
  const momS = Math.min(Math.max(-mom3 / 20, 0), 1);
  const gold = Math.round(5 + (peS*0.4 + vixS*0.35 + momS*0.25) * 25);
  const eq   = 100 - gold;

  const mf = Math.max(0, (mom3/15) * (1-vixS));
  const qf = 0.5 + vixS*0.5;
  const vf = Math.max(0, (pe-18)/12);
  const lf = Math.min(1, vixS*1.5);
  const t  = mf+qf+vf+lf || 1;

  let a = {
    momentum: Math.round(mf/t*eq),
    quality:  Math.round(qf/t*eq),
    value:    Math.round(vf/t*eq),
    lowvol:   Math.round(lf/t*eq),
    gold,
  };
  a.quality += 100 - Object.values(a).reduce((s,x)=>s+x,0);
  return a;
}

const DEMO = {nifty50:22187,niftyChg:0.64,niftyPE:21.4,vix:13.8,source:"Demo",time:"--",isLive:false};

const FUNDS = [
  {key:"momentum", label:"Momentum",  fund:"Nifty200 Momentum 30",  color:"#f97316", icon:"⚡"},
  {key:"quality",  label:"Quality",   fund:"Nifty200 Quality 30",   color:"#38bdf8", icon:"💎"},
  {key:"value",    label:"Value",     fund:"Nifty500 Value 50",     color:"#a78bfa", icon:"🏷️"},
  {key:"lowvol",   label:"Low Vol",   fund:"Nifty Alpha LowVol 30", color:"#34d399", icon:"🛡️"},
  {key:"gold",     label:"Gold",      fund:"Nippon Gold BeES",      color:"#fbbf24", icon:"🥇"},
];

// ─── BAR ─────────────────────────────────────────────
function Bar({pct,color}) {
  const [w,setW] = useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW(pct),60);return()=>clearTimeout(t);},[pct]);
  return (
    <div style={{height:"5px",background:"rgba(255,255,255,0.06)",borderRadius:"3px",overflow:"hidden",marginTop:"5px"}}>
      <div style={{height:"100%",width:w+"%",background:color,borderRadius:"3px",transition:"width 1s cubic-bezier(.34,1.56,.64,1)"}}/>
    </div>
  );
}

// ─── DONUT ────────────────────────────────────────────
function Donut({a,size=130}) {
  const cx=size/2,cy=size/2,r=size*.36,sw=size*.14;
  const C={momentum:"#f97316",quality:"#38bdf8",value:"#a78bfa",lowvol:"#34d399",gold:"#fbbf24"};
  let cum=-90;
  return (
    <svg width={size} height={size}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={sw}/>
      {FUNDS.map(f=>{
        const deg=(a[f.key]/100)*360, s=cum; cum+=deg;
        if(deg<1) return null;
        const sr=s*Math.PI/180, er=(s+deg)*Math.PI/180;
        const d=`M ${cx+r*Math.cos(sr)} ${cy+r*Math.sin(sr)} A ${r} ${r} 0 ${deg>180?1:0} 1 ${cx+r*Math.cos(er)} ${cy+r*Math.sin(er)}`;
        return <path key={f.key} d={d} fill="none" stroke={C[f.key]} strokeWidth={sw} strokeLinecap="butt" opacity={0.9}/>;
      })}
      <text x={cx} y={cy-6} textAnchor="middle" fill="#e2e8f0" fontSize={size*.1} fontFamily="Syne" fontWeight="800">{a.gold}%</text>
      <text x={cx} y={cy+9} textAnchor="middle" fill="#64748b" fontSize={size*.056}>Gold</text>
    </svg>
  );
}

// ─── APP ──────────────────────────────────────────────
function App() {

  const [sig,     setSig]     = useState(DEMO);
  const [alloc,   setAlloc]   = useState(()=>calcAlloc(21.4,13.8,3));

  const [msg,     setMsg]     = useState("");
  const [applied, setApplied] = useState(false);
  const [aiText,  setAiText]  = useState("");
  const [aiLoad,  setAiLoad]  = useState(false);

  // Auto fetch on open
  useEffect(()=>{ doFetch(); }, []);
  // Auto refresh every 5 min
  useEffect(()=>{ const id=setInterval(doFetch,300000); return()=>clearInterval(id); },[]);

  function toast(m,d=3000){setMsg(m);setTimeout(()=>setMsg(""),d);}

  async function doFetch() {
    setLoading(true);
    toast("⏳ Fetching live NSE data...", 15000);
    const data = await getLiveData();
    if (data) {
      const a = calcAlloc(data.niftyPE, data.vix, sig.mom3||3);
      setPrev(alloc);
      setSig({...data, mom3: sig.mom3||3});
      setAlloc(a);
      setApplied(false);
      toast("✅ Live! Nifty "+data.nifty50.toLocaleString("en-IN")+" · "+data.source);
    } else {
      toast("⚠️ Could not fetch live data. Showing demo.");
    }
    setLoading(false);
  }

    try {
      const r = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:
          `Indian quant advisor. Nifty=${sig.nifty50}, PE=${sig.niftyPE}, VIX=${sig.vix}, Change=${sig.niftyChg}%.
Allocation: Mom=${alloc.momentum}%, Quality=${alloc.quality}%, Value=${alloc.value}%, LowVol=${alloc.lowvol}%, Gold=${alloc.gold}%.
Explain in 4 simple lines why each % makes sense for Indian retail investor right now.`
        }]})
      });
      const d = await r.json();
      setAiText(d.content?.map(b=>b.text||"").join("")||"No response");

        {/* HEADER */}
        <div style={{padding:"20px 20px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

              <div style={{fontSize:11,color:"#475569",fontWeight:600,letterSpacing:".5px",marginBottom:12}}>AUTO ALLOCATION</div>
              {FUNDS.map(f=>(

                  <span style={{fontSize:14,width:20,textAlign:"center"}}>{f.icon}</span>

                      <span style={{fontSize:11,color:"#94a3b8"}}>{f.label}</span>

                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:"#cbd5e1"}}>{r.s} → <span style={{color:"#fbbf24"}}>{r.e}</span></div>

        {tab==="ai" && (
          <div style={{padding:"0 20px",animation:"up .3s ease"}}>
            <div style={{background:"rgba(99,102,241,.07)",border:"1px solid rgba(99,102,241,.18)",borderRadius:16,padding:14,marginBottom:14}}>

              <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                {[["PE",sig.niftyPE],["VIX",sig.vix],["Nifty",sig.nifty50.toLocaleString("en-IN")],["Gold",alloc.gold+"%"]].map(([k,v])=>(
                  <div key={k}><span style={{color:"#475569",fontSize:11}}>{k} </span><span style={{fontWeight:700,color:"#e2e8f0",fontSize:13}}>{v}</span></div>
                ))}
              </div>
            </div>

            <button onClick={doAI} disabled={aiLoad} style={{width:"100%",padding:14,marginBottom:14,background:aiLoad?"rgba(255,255,255,.02)":"linear-gradient(135deg,rgba(99,102,241,.2),rgba(99,102,241,.07))",border:"1px solid rgba(99,102,241,.25)",borderRadius:12,color:aiLoad?"#475569":"#818cf8",fontWeight:700,fontSize:13,cursor:aiLoad?"not-allowed":"pointer",fontFamily:"DM Sans,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {aiLoad?<><span style={{width:14,height:14,border:"2px solid #6366f1",borderTopColor:"transparent",borderRadius:"50%",display:"inline-block",animation:"spin .8s linear infinite"}}/> Analysing...</>:"✦ Ask Claude to Explain This Allocation"}
            </button>

            {aiText && (
              <div style={{background:"rgba(15,23,42,.9)",border:"1px solid rgba(99,102,241,.15)",borderRadius:14,padding:16,marginBottom:14,animation:"up .4s ease"}}>
                <div style={{fontSize:10,color:"#6366f1",fontWeight:600,marginBottom:8}}>CLAUDE'S ANALYSIS</div>
                <div style={{fontSize:13,color:"#cbd5e1",lineHeight:1.85}}>{aiText}</div>
              </div>
            )}

            <div style={{fontSize:11,color:"#475569",fontWeight:600,marginBottom:10}}>CURRENT ALLOCATION</div>
            {FUNDS.map(f=>(
              <div key={f.key} style={{display:"flex",gap:10,alignItems:"center",background:"rgba(255,255,255,.02)",border:`1px solid ${f.color}15`,borderRadius:12,padding:11,marginBottom:8}}>
                <span style={{fontSize:20}}>{f.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:600}}>{f.label} <span style={{color:f.color,fontFamily:"Syne,sans-serif",fontWeight:700}}>{alloc[f.key]}%</span></div>
                  <div style={{fontSize:11,color:"#475569"}}>{f.fund}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(7,11,18,.97)",borderTop:"1px solid rgba(255,255,255,.05)",backdropFilter:"blur(20px)",display:"flex",zIndex:100}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"11px 0 14px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <div style={{fontSize:17,opacity:tab===t.id?1:.3,transition:"opacity .2s"}}>{t.icon}</div>
            <div style={{fontSize:9,fontWeight:600,fontFamily:"DM Sans,sans-serif",color:tab===t.id?"#fbbf24":"#475569",letterSpacing:".3px"}}>{t.label}</div>
            {tab===t.id && <div style={{width:4,height:4,borderRadius:"50%",background:"#fbbf24"}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
