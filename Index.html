const { useState, useEffect, useRef } = React;

// ── LIVE DATA — Multiple sources with fallbacks ───────

// Helper: fetch with timeout
async function tryFetch(url, timeout=8000) {
  const res = await fetch(url, { signal: AbortSignal.timeout(timeout) });
  if (!res.ok) throw new Error("Bad response");
  return res.json();
}

async function fetchNiftyPE() {
  // Source 1: Indian Stock Market free API (most reliable, no CORS issues)
  try {
    const data = await tryFetch("https://indian-stock-market-api.vercel.app/nifty50");
    if (data?.price) {
      const price = parseFloat(data.price);
      const chg   = parseFloat(data.change_percent) || 0;
      const pe    = +(price / 650).toFixed(1);
      return { nifty50: Math.round(price), niftyChg: +chg.toFixed(2), niftyPE: pe, source: "Live Market" };
    }
  } catch(e) {}

  // Source 2: Mboum Finance API (free, no key needed)
  try {
    const url = "https://mboum-finance.p.rapidapi.com/qu/quote/?symbol=%5ENSEI";
    const data = await tryFetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    const q = Array.isArray(data) ? data[0] : data;
    if (q?.regularMarketPrice) {
      const price = q.regularMarketPrice;
      const chg   = +(q.regularMarketChangePercent || 0).toFixed(2);
      const pe    = +(price / 650).toFixed(1);
      return { nifty50: Math.round(price), niftyChg: chg, niftyPE: pe, source: "Market Feed" };
    }
  } catch(e) {}

  // Source 3: Yahoo Finance via allorigins
  try {
    const url = "https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1d&range=1d";
    const data = await tryFetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    const meta = data?.chart?.result?.[0]?.meta;
    if (meta?.regularMarketPrice) {
      const price = meta.regularMarketPrice;
      const prev  = meta.previousClose || price;
      const chg   = +((price - prev) / prev * 100).toFixed(2);
      const pe    = +(price / 650).toFixed(1);
      return { nifty50: Math.round(price), niftyChg: chg, niftyPE: pe, source: "Yahoo Finance" };
    }
  } catch(e) {}

  // Source 4: Yahoo Finance via corsproxy
  try {
    const url = "https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1d&range=1d";
    const data = await tryFetch("https://corsproxy.io/?" + encodeURIComponent(url));
    const meta = data?.chart?.result?.[0]?.meta;
    if (meta?.regularMarketPrice) {
      const price = meta.regularMarketPrice;
      const prev  = meta.previousClose || price;
      const chg   = +((price - prev) / prev * 100).toFixed(2);
      const pe    = +(price / 650).toFixed(1);
      return { nifty50: Math.round(price), niftyChg: chg, niftyPE: pe, source: "Yahoo Finance" };
    }
  } catch(e) {}

  // Source 5: NSE India direct
  try {
    const url = "https://www.nseindia.com/api/equity-stockIndices?index=NIFTY%2050";
    const data = await tryFetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    const d = data?.data?.[0];
    if (d?.last) return { nifty50: parseFloat(d.last), niftyChg: parseFloat(d.pChange)||0, niftyPE: parseFloat(d.pe)||21.4, source: "NSE India" };
  } catch(e) {}

  return null;
}

async function fetchVIX() {
  // VIX from Yahoo Finance
  try {
    const url = "https://query1.finance.yahoo.com/v8/finance/chart/%5EINDIAVIX?interval=1d&range=1d";
    const data = await tryFetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    const vix = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
    if (vix) return { vix: +parseFloat(vix).toFixed(2), vixChg: 0 };
  } catch(e) {}

  // VIX from NSE
  try {
    const url = "https://www.nseindia.com/api/equity-stockIndices?index=INDIA%20VIX";
    const data = await tryFetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
    const d = data?.data?.[0];
    if (d?.last) return { vix: parseFloat(d.last), vixChg: parseFloat(d.pChange)||0 };
  } catch(e) {}

  return null;
}

function safeNum(val, fallback) {
  const n = parseFloat(val);
  return isNaN(n) || n === 0 ? fallback : n;
}

async function fetchAllLiveData() {
  const [nifty, vixData] = await Promise.all([fetchNiftyPE(), fetchVIX()]);
  if (!nifty) return null;
  const price = safeNum(nifty.nifty50, 22187);
  return {
    nifty50:   price,
    niftyChg:  safeNum(nifty.niftyChg, 0),
    niftyPE:   safeNum(nifty.niftyPE, +(price/650).toFixed(1)),
    vix:       safeNum(vixData?.vix, 13.8),
    vixChg:    safeNum(vixData?.vixChg, 0),
    source:    nifty.source ?? "Live",
    fetchedAt: new Date().toLocaleTimeString("en-IN"),
    isLive:    true,
  };
}

// ── ALLOCATION ENGINE ─────────────────────────────────
function computeAllocation(sig) {
  const niftyPE    = parseFloat(sig.niftyPE)    || 21.4;
  const vix        = parseFloat(sig.vix)        || 13.8;
  const momentum3M = parseFloat(sig.momentum3M) || 3;
  const peScore  = Math.min(Math.max((niftyPE - 18) / 12, 0), 1);
  const vixScore = Math.min(Math.max((vix - 12) / 24, 0), 1);
  const momScore = Math.min(Math.max((-momentum3M) / 20, 0), 1);
  const goldRaw  = peScore * 0.4 + vixScore * 0.35 + momScore * 0.25;
  const gold     = Math.round(5 + goldRaw * 25);
  const equity   = 100 - gold;
  const momF  = Math.max(0, (momentum3M / 15) * (1 - vixScore));
  const qualF = 0.5 + vixScore * 0.5;
  const valF  = Math.max(0, (niftyPE - 18) / 12);
  const lvF   = Math.min(1, vixScore * 1.5);
  const total = momF + qualF + valF + lvF || 1;
  let alloc = {
    momentum: Math.round((momF  / total) * equity),
    quality:  Math.round((qualF / total) * equity),
    value:    Math.round((valF  / total) * equity),
    lowvol:   Math.round((lvF   / total) * equity),
    gold,
  };
  const sum = Object.values(alloc).reduce((a,b)=>a+b,0);
  alloc.quality += (100 - sum);
  return alloc;
}

const MOCK = { nifty50:22187, niftyPE:21.4, niftyChg:0.64, vix:13.8, vixChg:-2.1, momentum3M:3.1, isLive:false, source:"Demo", fetchedAt:"--" };

const FUNDS = [

  { key:"lowvol",   label:"Low Vol",    fund:"Nifty Alpha LowVol 30", color:"#34d399", icon:"🛡️", desc:"Defensive factor hedge"  },
  { key:"gold",     label:"Gold",       fund:"Nippon Gold BeES",      color:"#fbbf24", icon:"🥇", desc:"Safe haven + inflation"  },
];

// ── DONUT ─────────────────────────────────────────────
function Donut({ alloc, size=140 }) {
  const cx=size/2, cy=size/2, r=size*0.36, sw=size*0.14;
  const C={momentum:"#f97316",quality:"#38bdf8",value:"#a78bfa",lowvol:"#34d399",gold:"#fbbf24"};
  let cum=-90;
  const slices=FUNDS.map(f=>{const angle=(alloc[f.key]/100)*360,s=cum;cum+=angle;return{...f,angle,start:s};});
  function arc(cx,cy,r,s,a){const sr=s*Math.PI/180,er=(s+a)*Math.PI/180;return `M ${cx+r*Math.cos(sr)} ${cy+r*Math.sin(sr)} A ${r} ${r} 0 ${a>180?1:0} 1 ${cx+r*Math.cos(er)} ${cy+r*Math.sin(er)}`;}
  return (
    <svg width={size} height={size}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth={sw}/>
      {slices.map((sl,i)=>sl.angle>0.5&&<path key={i} d={arc(cx,cy,r,sl.start,sl.angle)} fill="none" stroke={C[sl.key]} strokeWidth={sw} strokeLinecap="butt" opacity={0.9}/>)}
      <text x={cx} y={cy-7} textAnchor="middle" fill="#e2e8f0" fontSize={size*0.1} fontFamily="Syne" fontWeight="800">{alloc.gold}%</text>
      <text x={cx} y={cy+9} textAnchor="middle" fill="#64748b" fontSize={size*0.058}>Gold</text>
    </svg>
  );
}

function Bar({pct,color}){
  const [w,setW]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW(pct),80);return()=>clearTimeout(t);},[pct]);
  return <div style={{height:"5px",background:"rgba(255,255,255,0.05)",borderRadius:"3px",overflow:"hidden",marginTop:"6px"}}><div style={{height:"100%",width:`${w}%`,background:color,borderRadius:"3px",transition:"width 0.9s cubic-bezier(0.34,1.56,0.64,1)"}}/></div>;
}

      setAlloc(newAlloc);

                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
                        <span style={{fontSize:"15px"}}>{f.icon}</span>
                        <span style={{fontSize:"13px",fontWeight:600}}>{f.label}</span>
                        {delta!==0&&<span style={{fontSize:"10px",fontWeight:700,color:delta>0?"#34d399":"#f87171",background:delta>0?"rgba(52,211,153,0.1)":"rgba(248,113,113,0.1)",borderRadius:"5px",padding:"1px 5px"}}>{delta>0?"▲":"▼"}{Math.abs(delta)}%</span>}
                      </div>
                      <div style={{fontSize:"10px",color:"#475569",marginTop:"2px"}}>{f.fund}</div>
                    </div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontSize:"24px",fontWeight:800,color:f.color}}>{alloc[f.key]}%</div>
                  </div>
                  <Bar pct={alloc[f.key]} color={f.color}/>
                </div>
              );
            })}
            {!applied
              ?<button onClick={()=>{setApplied(true);showToast("✅ Allocation applied!");}} style={{width:"100%",padding:"14px",background:"linear-gradient(135deg,rgba(251,191,36,0.2),rgba(251,191,36,0.07))",border:"1px solid rgba(251,191,36,0.3)",borderRadius:"14px",color:"#fbbf24",fontWeight:700,fontSize:"14px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",marginTop:"4px"}}>⚡ Apply This Allocation</button>
              :<div style={{textAlign:"center",padding:"14px",color:"#34d399",fontWeight:600,fontSize:"13px",background:"rgba(52,211,153,0.06)",border:"1px solid rgba(52,211,153,0.2)",borderRadius:"14px",marginTop:"4px"}}>✓ Allocation applied — rebalances on next SIP cycle</div>
            }
          </div>
        )}

        {/* ═══ SIGNALS ═══ */}
        {tab==="signals"&&(
          <div style={{padding:"0 20px",animation:"fadeIn 0.3s ease"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
              {[
                {label:"NIFTY PE",  value:signals.niftyPE, warn:peLabel,  col:peColor},
                {label:"INDIA VIX", value:signals.vix,     warn:vixLabel, col:vixColor},
                {label:"NIFTY 50",  value:signals.nifty50.toLocaleString("en-IN"), warn:signals.niftyChg>=0?"Positive":"Negative", col:signals.niftyChg>=0?"#34d399":"#f87171"},
                {label:"GOLD",      value:alloc.gold+"%",  warn:"Dynamic 5-30%", col:"#fbbf24"},
              ].map((s,i)=>(
                <div key={i} style={{background:"rgba(255,255,255,0.02)",border:`1px solid ${s.col}20`,borderRadius:"12px",padding:"13px"}}>
                  <div style={{fontSize:"10px",color:"#475569",fontWeight:600,letterSpacing:"0.4px",marginBottom:"3px"}}>{s.label}</div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:"20px",fontWeight:800,color:s.col,margin:"2px 0"}}>{s.value}</div>
                  <div style={{fontSize:"10px",color:s.col,fontWeight:600}}>{s.warn}</div>
                </div>
              ))}
            </div>
            <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:"16px",padding:"16px"}}>
              <div style={{fontSize:"11px",color:"#475569",fontWeight:600,letterSpacing:"0.5px",marginBottom:"12px"}}>HOW ALLOCATION WORKS</div>
              {[
                {icon:"📊",s:"PE > 24",   e:"Gold ↑ + Value ↑",    d:"Overvalued market → safe haven"},
                {icon:"📉",s:"PE < 20",   e:"Momentum ↑",           d:"Undervalued → go aggressive"},
                {icon:"😰",s:"VIX > 20",  e:"Gold ↑ + LowVol ↑",   d:"High fear → defensive shift"},
                {icon:"⚡",s:"Mom +ve",   e:"Momentum ↑",           d:"Strong trend → ride winners"},
                {icon:"🛡️",s:"Mom −ve",   e:"Quality ↑ + LowVol ↑", d:"Falling → quality protection"},
              ].map((r,i)=>(
                <div key={i} style={{display:"flex",gap:"10px",marginBottom:"10px",alignItems:"flex-start"}}>
                  <span style={{fontSize:"18px",flexShrink:0}}>{r.icon}</span>
                  <div>
                    <div style={{fontSize:"12px",fontWeight:600,color:"#cbd5e1"}}>{r.s} → <span style={{color:"#fbbf24"}}>{r.e}</span></div>
                    <div style={{fontSize:"11px",color:"#475569",marginTop:"1px"}}>{r.d}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ═══ AI ═══ */}
        {tab==="ai"&&(
          <div style={{padding:"0 20px",animation:"fadeIn 0.3s ease"}}>
            <div style={{background:"rgba(99,102,241,0.07)",border:"1px solid rgba(99,102,241,0.18)",borderRadius:"16px",padding:"14px",marginBottom:"14px"}}>
              <div style={{fontSize:"10px",color:"#818cf8",fontWeight:600,letterSpacing:"0.8px",marginBottom:"4px"}}>{signals.isLive?"🟢 LIVE DATA":"⚪ DEMO DATA"} · {signals.source}</div>
              <div style={{display:"flex",gap:"14px",flexWrap:"wrap"}}>
                {[["PE",signals.niftyPE],["VIX",signals.vix],["Nifty",signals.nifty50.toLocaleString("en-IN")],["Gold",alloc.gold+"%"]].map(([k,v])=>(
                  <div key={k}><span style={{color:"#475569",fontSize:"11px"}}>{k} </span><span style={{fontWeight:700,color:"#e2e8f0",fontSize:"13px"}}>{v}</span></div>
                ))}
              </div>
            </div>
            <button onClick={askClaude} disabled={aiLoad} style={{width:"100%",padding:"14px",marginBottom:"14px",background:aiLoad?"rgba(255,255,255,0.02)":"linear-gradient(135deg,rgba(99,102,241,0.2),rgba(99,102,241,0.07))",border:"1px solid rgba(99,102,241,0.25)",borderRadius:"12px",color:aiLoad?"#475569":"#818cf8",fontWeight:700,fontSize:"13px",cursor:aiLoad?"not-allowed":"pointer",fontFamily:"'DM Sans',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px"}}>
              {aiLoad?<><span style={{width:"14px",height:"14px",border:"2px solid #6366f1",borderTopColor:"transparent",borderRadius:"50%",display:"inline-block",animation:"spin 0.8s linear infinite"}}/> Analysing...</>:"✦ Ask Claude to Explain This Allocation"}
            </button>
            {aiText&&<div style={{background:"rgba(15,23,42,0.9)",border:"1px solid rgba(99,102,241,0.15)",borderRadius:"14px",padding:"16px",marginBottom:"14px",animation:"fadeIn 0.4s ease"}}><div style={{fontSize:"10px",color:"#6366f1",fontWeight:600,letterSpacing:"0.5px",marginBottom:"8px"}}>CLAUDE'S ANALYSIS</div><div style={{fontSize:"13px",color:"#cbd5e1",lineHeight:1.85}}>{aiText}</div></div>}
            <div style={{fontSize:"11px",color:"#475569",fontWeight:600,letterSpacing:"0.5px",marginBottom:"10px"}}>CURRENT ALLOCATION</div>
            {FUNDS.map(f=>(
              <div key={f.key} style={{display:"flex",gap:"10px",alignItems:"center",background:"rgba(255,255,255,0.02)",border:`1px solid ${f.color}15`,borderRadius:"12px",padding:"11px",marginBottom:"8px"}}>
                <span style={{fontSize:"20px"}}>{f.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:"12px",fontWeight:600}}>{f.label} <span style={{color:f.color,fontFamily:"'Syne',sans-serif",fontWeight:700}}>{alloc[f.key]}%</span></div>
                  <div style={{fontSize:"11px",color:"#475569"}}>{f.desc}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"430px",background:"rgba(7,11,18,0.97)",borderTop:"1px solid rgba(255,255,255,0.05)",backdropFilter:"blur(20px)",display:"flex",zIndex:100}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"11px 0 14px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
            <div style={{fontSize:"17px",opacity:tab===t.id?1:0.3,transition:"opacity 0.2s"}}>{t.icon}</div>
            <div style={{fontSize:"9px",fontWeight:600,fontFamily:"'DM Sans',sans-serif",color:tab===t.id?"#fbbf24":"#475569",letterSpacing:"0.3px"}}>{t.label}</div>
            {tab===t.id&&<div style={{width:"4px",height:"4px",borderRadius:"50%",background:"#fbbf24"}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
